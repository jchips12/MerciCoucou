<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Learning for Kids</title>
  
  <meta name="theme-color" content="#fef3c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="French Kids">
  
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      touch-action: manipulation;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col justify-between text-slate-800 select-none">

  <!-- HEADER -->
  <header class="bg-white/80 backdrop-blur-md border-b-4 border-amber-200 sticky top-0 z-40 p-3 sm:p-4">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center space-x-2">
        <span class="text-3xl sm:text-4xl">🇫🇷</span>
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-amber-600 tracking-wide leading-tight">Apprendre le Français</h1>
          <p class="text-xs text-amber-800 font-bold hidden sm:block">French Learning for Kids</p>
        </div>
      </div>

      <!-- Controls & Toggles -->
      <div class="flex items-center space-x-2">
        <button id="toggleAudioBtn" onclick="toggleAutoAudio()" 
                class="p-2 sm:px-3 sm:py-2 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-2xl flex items-center space-x-1.5 transition font-semibold text-xs sm:text-sm">
          <i id="audioIcon" class="fas fa-volume-up text-base text-amber-600"></i>
          <span class="hidden sm:inline" id="audioToggleText">Auto-Voice: ON</span>
        </button>

        <button id="toggleEnglishBtn" onclick="toggleEnglish()" 
                class="p-2 sm:px-3 sm:py-2 bg-blue-100 hover:bg-blue-200 text-blue-800 rounded-2xl flex items-center space-x-1.5 transition font-semibold text-xs sm:text-sm">
          <i class="fas fa-language text-base text-blue-600"></i>
          <span class="hidden sm:inline">English Helper</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-4xl mx-auto w-full">

    <div class="flex flex-wrap justify-center bg-amber-200/60 p-1.5 rounded-3xl mb-3 space-x-1 sm:space-x-2 border-2 border-amber-300">
      <button id="modColors" onclick="switchModule('colors')" 
              class="px-3 sm:px-4 py-2 rounded-2xl font-bold text-sm sm:text-base transition-all duration-200 bg-amber-500 text-white shadow-md">
        🎨 Colors
      </button>
      <button id="modNumbers" onclick="switchModule('numbers')" 
              class="px-3 sm:px-4 py-2 rounded-2xl font-bold text-sm sm:text-base transition-all duration-200 text-amber-900 hover:bg-white/50">
        🔢 Numbers
      </button>
      <button id="modAlphabet" onclick="switchModule('alphabet')" 
              class="px-3 sm:px-4 py-2 rounded-2xl font-bold text-sm sm:text-base transition-all duration-200 text-amber-900 hover:bg-white/50">
        🔤 Alphabet
      </button>
    </div>

    <!-- NUMBER RANGE SELECTOR FILTER (Visible only in Numbers module) -->
    <div id="numberRangeContainer" class="hidden mb-4 bg-white/90 px-4 py-2 rounded-2xl border-2 border-amber-300 flex items-center space-x-3 text-xs sm:text-sm">
      <span class="font-bold text-amber-800">Number Range:</span>
      <button id="range10" onclick="setNumberRange(10)" class="px-3 py-1 bg-amber-500 text-white font-bold rounded-xl shadow-sm">1 – 10</button>
      <button id="range20" onclick="setNumberRange(20)" class="px-3 py-1 bg-amber-100 text-amber-800 font-bold rounded-xl hover:bg-amber-200">1 – 20</button>
    </div>

    <!-- MODE SWITCH TABS (Learn vs Quiz) -->
    <div class="flex bg-amber-200/40 p-1 rounded-2xl mb-4 sm:mb-6 space-x-2 border border-amber-300/80">
      <button id="tabLearn" onclick="switchMode('learn')" 
              class="px-4 py-1.5 rounded-xl font-bold text-sm sm:text-base transition-all duration-200 bg-white text-amber-800 shadow-sm">
        📖 Learn Mode
      </button>
      <button id="tabQuiz" onclick="switchMode('quiz')" 
              class="px-4 py-1.5 rounded-xl font-bold text-sm sm:text-base transition-all duration-200 text-amber-900 hover:bg-white/50">
        🎮 Mini Quiz
      </button>
    </div>

    <!-- ==================== LEARN MODE SECTION ==================== -->
    <section id="learnSection" class="w-full flex flex-col items-center">
      
      <!-- MAIN DISPLAY CARD -->
      <div id="displayCard" 
           onclick="handleCardClick(event)" 
           class="w-full max-w-md h-72 sm:h-96 rounded-3xl border-8 border-white custom-shadow transition-all duration-300 transform active:scale-95 cursor-pointer relative flex flex-col items-center justify-center p-6 text-center overflow-hidden group">
        
        <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-full shadow-md flex items-center space-x-2 group-hover:scale-110 transition-transform">
          <i class="fas fa-volume-up text-slate-700 text-base"></i>
          <span class="text-xs font-bold text-slate-600">Tap to Listen</span>
        </div>

        <h2 id="mainDisplayTitle" class="text-6xl sm:text-8xl font-black tracking-wide drop-shadow-md text-white mb-2 transition-all">
          Rouge
        </h2>

        <div id="englishContainer" class="bg-black/30 backdrop-blur-md px-4 py-2 rounded-2xl text-white mt-2 transition-all">
          <p id="englishName" class="text-xl sm:text-2xl font-bold">Red</p>
          <p id="phoneticText" class="text-xs sm:text-sm font-semibold opacity-80 italic">/roozh/</p>
        </div>

        <span class="absolute bottom-3 text-xs text-white/80 font-semibold tracking-wider uppercase">
          ✨ Tap card to pronounce! ✨
        </span>
      </div>

      <!-- NAVIGATION CONTROLS -->
      <div class="w-full max-w-md mt-6 grid grid-cols-3 gap-3 sm:gap-4">
        <button onclick="prevItem()" 
                class="bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-black py-4 px-2 rounded-2xl border-b-4 border-sky-700 text-sm sm:text-base flex items-center justify-center space-x-2 shadow-lg transition transform active:translate-y-1">
          <i class="fas fa-chevron-left text-lg"></i>
          <span>Précédent</span>
        </button>

        <button onclick="randomItem()" 
                class="bg-purple-500 hover:bg-purple-600 active:bg-purple-700 text-white font-black py-4 px-2 rounded-2xl border-b-4 border-purple-800 text-xs sm:text-base flex items-center justify-center space-x-2 shadow-lg transition transform active:translate-y-1">
          <i class="fas fa-dice text-lg"></i>
          <span>Aléatoire</span>
        </button>

        <button onclick="nextItem()" 
                class="bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-black py-4 px-2 rounded-2xl border-b-4 border-emerald-700 text-sm sm:text-base flex items-center justify-center space-x-2 shadow-lg transition transform active:translate-y-1">
          <span>Suivant</span>
          <i class="fas fa-chevron-right text-lg"></i>
        </button>
      </div>

      <!-- SETTINGS BAR -->
      <div class="mt-6 w-full max-w-md bg-white/80 rounded-2xl p-3 border border-amber-200 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-700 gap-2">
        <div class="flex items-center space-x-2">
          <i class="fas fa-volume-up text-amber-500 text-base"></i>
          <span class="font-bold">Speak on Navigate:</span>
          <input type="checkbox" id="navAudioCheckbox" checked onchange="toggleNavAudio(this.checked)" class="w-4 h-4 accent-amber-500 cursor-pointer">
        </div>
        <div class="flex items-center space-x-1">
          <span class="font-bold text-slate-500">Speed:</span>
          <button onclick="setSpeechRate(0.7)" class="px-2 py-1 rounded bg-amber-100 hover:bg-amber-200 font-bold">Slow 🐢</button>
          <button onclick="setSpeechRate(0.9)" class="px-2 py-1 rounded bg-amber-200 hover:bg-amber-300 font-bold">Normal 🧒</button>
        </div>
      </div>

    </section>

    <!-- ==================== MINI QUIZ SECTION ==================== -->
    <section id="quizSection" class="w-full flex flex-col items-center hidden">
      <div class="bg-white/90 rounded-3xl p-6 border-4 border-amber-200 w-full max-w-md text-center shadow-lg">
        
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-amber-100">
          <span class="text-base font-bold text-amber-800">Score: <span id="quizScoreText" class="text-2xl font-black text-amber-600">0</span></span>
          <button onclick="resetQuizScore()" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1.5 rounded-xl font-bold">
            🔄 Reset
          </button>
        </div>

        <p class="text-sm font-semibold text-slate-500 mb-1">Find the matching match for:</p>
        <div class="flex items-center justify-center space-x-2 mb-6">
          <h3 id="quizQuestionText" class="text-3xl sm:text-4xl font-black text-slate-800">Rouge</h3>
          <button onclick="speakWord(currentQuizTarget ? currentQuizTarget.french : '')" class="p-2 bg-amber-100 text-amber-700 rounded-full hover:bg-amber-200 transition">
            <i class="fas fa-volume-up text-lg"></i>
          </button>
        </div>

        <div id="quizOptionsGrid" class="grid grid-cols-2 gap-4">
          <!-- Options populated dynamically -->
        </div>

        <div id="quizFeedback" class="mt-4 min-h-[3rem] flex items-center justify-center font-bold text-lg rounded-2xl p-2 transition-all opacity-0">
        </div>
      </div>
    </section>

  </main>

  <footer class="p-3 text-center text-xs font-semibold text-amber-800/70">
    French Learning for Kids • Colors, Numbers & Alphabet
  </footer>

  <script>
    // DATASETS FOR MODULES
    const colorDataset = [
      { french: "Rouge", english: "Red", phonetic: "/roozh/", hex: "#EF4444", textDark: false },
      { french: "Bleu", english: "Blue", phonetic: "/bluh/", hex: "#3B82F6", textDark: false },
      { french: "Jaune", english: "Yellow", phonetic: "/zhohn/", hex: "#FACC15", textDark: true },
      { french: "Vert", english: "Green", phonetic: "/vair/", hex: "#22C55E", textDark: false },
      { french: "Orange", english: "Orange", phonetic: "/oh-rahnj/", hex: "#F97316", textDark: false },
      { french: "Rose", english: "Pink", phonetic: "/rohz/", hex: "#EC4899", textDark: false },
      { french: "Violet", english: "Purple", phonetic: "/vyoh-lay/", hex: "#A855F7", textDark: false },
      { french: "Noir", english: "Black", phonetic: "/nwahr/", hex: "#1E293B", textDark: false },
      { french: "Blanc", english: "White", phonetic: "/blahnk/", hex: "#FFFFFF", textDark: true, border: true },
      { french: "Gris", english: "Gray", phonetic: "/gree/", hex: "#64748B", textDark: false },
      { french: "Marron", english: "Brown", phonetic: "/mah-rohn/", hex: "#78350F", textDark: false }
    ];

    const numberDataset = [
      { french: "Un", english: "1", phonetic: "/uhn/", hex: "#F59E0B" },
      { french: "Deux", english: "2", phonetic: "/duh/", hex: "#10B981" },
      { french: "Trois", english: "3", phonetic: "/twah/", hex: "#6366F1" },
      { french: "Quatre", english: "4", phonetic: "/kat-ruh/", hex: "#EC4899" },
      { french: "Cinq", english: "5", phonetic: "/sank/", hex: "#8B5CF6" },
      { french: "Six", english: "6", phonetic: "/sees/", hex: "#14B8A6" },
      { french: "Sept", english: "7", phonetic: "/set/", hex: "#F97316" },
      { french: "Huit", english: "8", phonetic: "/weet/", hex: "#06B6D4" },
      { french: "Neuf", english: "9", phonetic: "/nuhf/", hex: "#84CC16" },
      { french: "Dix", english: "10", phonetic: "/dees/", hex: "#EF4444" },
      { french: "Onze", english: "11", phonetic: "/ohnz/", hex: "#3B82F6" },
      { french: "Douze", english: "12", phonetic: "/doo-zuh/", hex: "#10B981" },
      { french: "Treize", english: "13", phonetic: "/trehz/", hex: "#A855F7" },
      { french: "Quatorze", english: "14", phonetic: "/kah-torz/", hex: "#F59E0B" },
      { french: "Quinze", english: "15", phonetic: "/kanz/", hex: "#EC4899" },
      { french: "Seize", english: "16", phonetic: "/sehz/", hex: "#06B6D4" },
      { french: "Dix-sept", english: "17", phonetic: "/dees-set/", hex: "#F97316" },
      { french: "Dix-huit", english: "18", phonetic: "/dees-weet/", hex: "#8B5CF6" },
      { french: "Dix-neuf", english: "19", phonetic: "/dees-nuhf/", hex: "#84CC16" },
      { french: "Vingt", english: "20", phonetic: "/van/", hex: "#EF4444" }
    ];

    const alphabetDataset = [
      { french: "A", english: "Ah", phonetic: "/ah/", hex: "#EF4444" },
      { french: "B", english: "Be", phonetic: "/beh/", hex: "#3B82F6" },
      { french: "C", english: "Se", phonetic: "/seh/", hex: "#10B981" },
      { french: "D", english: "De", phonetic: "/deh/", hex: "#F59E0B" },
      { french: "E", english: "Euh", phonetic: "/euh/", hex: "#EC4899" },
      { french: "F", english: "Eff", phonetic: "/eff/", hex: "#8B5CF6" },
      { french: "G", english: "Jhe", phonetic: "/zheh/", hex: "#14B8A6" },
      { french: "H", english: "Ash", phonetic: "/ash/", hex: "#F97316" },
      { french: "I", english: "Ee", phonetic: "/ee/", hex: "#06B6D4" },
      { french: "J", english: "Jee", phonetic: "/zhee/", hex: "#84CC16" },
      { french: "K", english: "Kah", phonetic: "/kah/", hex: "#EF4444" },
      { french: "L", english: "Ell", phonetic: "/ell/", hex: "#3B82F6" },
      { french: "M", english: "Emm", phonetic: "/emm/", hex: "#10B981" },
      { french: "N", english: "Enn", phonetic: "/enn/", hex: "#A855F7" },
      { french: "O", english: "Oh", phonetic: "/oh/", hex: "#F59E0B" },
      { french: "P", english: "Peh", phonetic: "/peh/", hex: "#EC4899" },
      { french: "Q", english: "Kew", phonetic: "/koo/", hex: "#06B6D4" },
      { french: "R", english: "Air", phonetic: "/air/", hex: "#F97316" },
      { french: "S", english: "Ess", phonetic: "/ess/", hex: "#8B5CF6" },
      { french: "T", english: "Teh", phonetic: "/teh/", hex: "#84CC16" },
      { french: "U", english: "Oo", phonetic: "/oo/", hex: "#EF4444" },
      { french: "V", english: "Veh", phonetic: "/veh/", hex: "#3B82F6" },
      { french: "W", english: "Double Veh", phonetic: "/doo-bluh-veh/", hex: "#10B981" },
      { french: "X", english: "Iks", phonetic: "/eeks/", hex: "#A855F7" },
      { french: "Y", english: "I-grec", phonetic: "/ee-grek/", hex: "#F59E0B" },
      { french: "Z", english: "Zed", phonetic: "/zed/", hex: "#EC4899" }
    ];

    // App State
    let currentModule = 'colors'; // 'colors', 'numbers', 'alphabet'
    let numberLimit = 10; // 10 or 20
    let currentIndex = 0;
    let autoPlayAudio = true;
    let showEnglish = true;
    let speechRate = 0.85;
    let synth = window.speechSynthesis;
    let frenchVoice = null;
    let quizScore = 0;
    let currentQuizTarget = null;

    function getActiveDataset() {
      if (currentModule === 'colors') return colorDataset;
      if (currentModule === 'alphabet') return alphabetDataset;
      if (currentModule === 'numbers') {
        return numberDataset.slice(0, numberLimit);
      }
      return colorDataset;
    }

    function initVoices() {
      if (!synth) return;
      let voices = synth.getVoices();
      frenchVoice = voices.find(v => v.lang.startsWith('fr') || v.lang.includes('FR')) || null;
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = initVoices;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initVoices();
      updateDisplay(false);
    });

    // MODULE SWITCHING logic
    function switchModule(moduleName) {
      currentModule = moduleName;
      currentIndex = 0;

      // Update module tab styling
      ['colors', 'numbers', 'alphabet'].forEach(m => {
        const btn = document.getElementById('mod' + m.charAt(0).toUpperCase() + m.slice(1));
        if (m === moduleName) {
          btn.className = "px-3 sm:px-4 py-2 rounded-2xl font-bold text-sm sm:text-base transition-all duration-200 bg-amber-500 text-white shadow-md";
        } else {
          btn.className = "px-3 sm:px-4 py-2 rounded-2xl font-bold text-sm sm:text-base transition-all duration-200 text-amber-900 hover:bg-white/50";
        }
      });

      // Show range selector only for numbers
      const rangeContainer = document.getElementById('numberRangeContainer');
      if (moduleName === 'numbers') {
        rangeContainer.classList.remove('hidden');
      } else {
        rangeContainer.classList.add('hidden');
      }

      updateDisplay(autoPlayAudio);
      if (!document.getElementById('quizSection').classList.contains('hidden')) {
        startNewQuizRound();
      }
    }

    // NUMBER RANGE FILTER
    function setNumberRange(limit) {
      numberLimit = limit;
      currentIndex = 0;
      
      const r10 = document.getElementById('range10');
      const r20 = document.getElementById('range20');

      if (limit === 10) {
        r10.className = "px-3 py-1 bg-amber-500 text-white font-bold rounded-xl shadow-sm";
        r20.className = "px-3 py-1 bg-amber-100 text-amber-800 font-bold rounded-xl hover:bg-amber-200";
      } else {
        r20.className = "px-3 py-1 bg-amber-500 text-white font-bold rounded-xl shadow-sm";
        r10.className = "px-3 py-1 bg-amber-100 text-amber-800 font-bold rounded-xl hover:bg-amber-200";
      }

      updateDisplay(autoPlayAudio);
      if (!document.getElementById('quizSection').classList.contains('hidden')) {
        startNewQuizRound();
      }
    }

    // DISPLAY CARD UPDATE
    function updateDisplay(shouldSpeak = autoPlayAudio) {
      const dataset = getActiveDataset();
      const item = dataset[currentIndex];
      const card = document.getElementById('displayCard');
      const title = document.getElementById('mainDisplayTitle');
      const englishText = document.getElementById('englishName');
      const phoneticText = document.getElementById('phoneticText');

      card.style.backgroundColor = item.hex;

      if (item.border) {
        card.classList.add('border-slate-300');
        card.classList.remove('border-white');
      } else {
        card.classList.add('border-white');
        card.classList.remove('border-slate-300');
      }

      if (item.textDark) {
        title.className = "text-6xl sm:text-8xl font-black tracking-wide text-slate-900 mb-2 transition-all drop-shadow-sm";
      } else {
        title.className = "text-6xl sm:text-8xl font-black tracking-wide text-white mb-2 transition-all drop-shadow-md";
      }

      title.textContent = item.french;
      englishText.textContent = item.english;
      phoneticText.textContent = item.phonetic;

      if (shouldSpeak) {
        speakWord(item.french);
      }
    }

    function nextItem() {
      const dataset = getActiveDataset();
      currentIndex = (currentIndex + 1) % dataset.length;
      updateDisplay();
      triggerConfetti(0.8, 0.5);
    }

    function prevItem() {
      const dataset = getActiveDataset();
      currentIndex = (currentIndex - 1 + dataset.length) % dataset.length;
      updateDisplay();
      triggerConfetti(0.2, 0.5);
    }

    function randomItem() {
      const dataset = getActiveDataset();
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * dataset.length);
      } while (newIndex === currentIndex && dataset.length > 1);
      
      currentIndex = newIndex;
      updateDisplay();
      triggerConfetti(0.5, 0.6);
    }

    function handleCardClick(e) {
      const dataset = getActiveDataset();
      const item = dataset[currentIndex];
      speakWord(item.french);
      
      const rect = e.currentTarget.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      triggerConfetti(x, y);
    }

    function toggleNavAudio(enabled) {
      autoPlayAudio = enabled;
      updateAudioToggleUI();
    }

    function toggleAutoAudio() {
      autoPlayAudio = !autoPlayAudio;
      document.getElementById('navAudioCheckbox').checked = autoPlayAudio;
      updateAudioToggleUI();
    }

    function updateAudioToggleUI() {
      const btn = document.getElementById('toggleAudioBtn');
      const icon = document.getElementById('audioIcon');
      const text = document.getElementById('audioToggleText');
      
      if (autoPlayAudio) {
        btn.className = "p-2 sm:px-3 sm:py-2 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-2xl flex items-center space-x-1.5 transition font-semibold text-xs sm:text-sm";
        icon.className = "fas fa-volume-up text-base text-amber-600";
        if (text) text.textContent = "Auto-Voice: ON";
      } else {
        btn.className = "p-2 sm:px-3 sm:py-2 bg-slate-200 hover:bg-slate-300 text-slate-600 rounded-2xl flex items-center space-x-1.5 transition font-semibold text-xs sm:text-sm";
        icon.className = "fas fa-volume-mute text-base text-slate-500";
        if (text) text.textContent = "Auto-Voice: OFF";
      }
    }

    function toggleEnglish() {
      showEnglish = !showEnglish;
      const container = document.getElementById('englishContainer');
      if (showEnglish) {
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }

    function setSpeechRate(rate) {
      speechRate = rate;
      const dataset = getActiveDataset();
      speakWord(dataset[currentIndex].french);
    }

    function speakWord(text) {
      if (!synth) return;
      synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = speechRate;
      utterance.pitch = 1.1;

      if (frenchVoice) {
        utterance.voice = frenchVoice;
      }

      synth.speak(utterance);
    }

    function triggerConfetti(originX = 0.5, originY = 0.5) {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 20,
          spread: 50,
          origin: { x: originX, y: originY },
          colors: ['#EF4444', '#3B82F6', '#FACC15', '#22C55E', '#EC4899']
        });
      }
    }

    // MODE SWITCHING & QUIZ ENGINE
    function switchMode(mode) {
      const learnSec = document.getElementById('learnSection');
      const quizSec = document.getElementById('quizSection');
      const tabLearn = document.getElementById('tabLearn');
      const tabQuiz = document.getElementById('tabQuiz');

      if (mode === 'learn') {
        learnSec.classList.remove('hidden');
        quizSec.classList.add('hidden');
        tabLearn.className = "px-4 py-1.5 rounded-xl font-bold text-sm sm:text-base transition-all duration-200 bg-white text-amber-800 shadow-sm";
        tabQuiz.className = "px-4 py-1.5 rounded-xl font-bold text-sm sm:text-base transition-all duration-200 text-amber-900 hover:bg-white/50";
      } else {
        learnSec.classList.add('hidden');
        quizSec.classList.remove('hidden');
        tabQuiz.className = "px-4 py-1.5 rounded-xl font-bold text-sm sm:text-base transition-all duration-200 bg-white text-amber-800 shadow-sm";
        tabLearn.className = "px-4 py-1.5 rounded-xl font-bold text-sm sm:text-base transition-all duration-200 text-amber-900 hover:bg-white/50";
        startNewQuizRound();
      }
    }

    function startNewQuizRound() {
      const dataset = getActiveDataset();
      const targetIndex = Math.floor(Math.random() * dataset.length);
      currentQuizTarget = dataset[targetIndex];

      document.getElementById('quizQuestionText').textContent = currentQuizTarget.french;
      
      if (autoPlayAudio) {
        speakWord(currentQuizTarget.french);
      }

      let options = [currentQuizTarget];
      while (options.length < Math.min(4, dataset.length)) {
        let randomChoice = dataset[Math.floor(Math.random() * dataset.length)];
        if (!options.some(o => o.french === randomChoice.french)) {
          options.push(randomChoice);
        }
      }

      options.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('quizOptionsGrid');
      grid.innerHTML = '';

      options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = `h-20 sm:h-24 rounded-2xl border-4 border-white shadow-md transition transform active:scale-95 flex items-center justify-center font-bold text-lg text-white drop-shadow-md ${option.border ? 'border-slate-300' : ''}`;
        btn.style.backgroundColor = option.hex;
        btn.textContent = option.english;
        btn.onclick = () => handleQuizAnswer(option);
        grid.appendChild(btn);
      });

      const feedback = document.getElementById('quizFeedback');
      feedback.style.opacity = '0';
    }

    function handleQuizAnswer(selected) {
      const feedback = document.getElementById('quizFeedback');
      if (selected.french === currentQuizTarget.french) {
        quizScore += 1;
        document.getElementById('quizScoreText').textContent = quizScore;
        
        feedback.textContent = "🎉 BRAVO! C'est super! 🎉";
        feedback.className = "mt-4 min-h-[3rem] flex items-center justify-center font-bold text-lg rounded-2xl p-2 transition-all bg-emerald-100 text-emerald-800 opacity-100";
        
        triggerConfetti(0.5, 0.5);
        speakWord("Bravo!");

        setTimeout(() => {
          startNewQuizRound();
        }, 1400);
      } else {
        feedback.textContent = "❌ Essaye encore! (Try again!)";
        feedback.className = "mt-4 min-h-[3rem] flex items-center justify-center font-bold text-lg rounded-2xl p-2 transition-all bg-rose-100 text-rose-800 opacity-100";
        speakWord("Non");
      }
    }

    function resetQuizScore() {
      quizScore = 0;
      document.getElementById('quizScoreText').textContent = '0';
      startNewQuizRound();
    }
  </script>
</body>
</html>
