<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Learning for Kids</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
    }
    .storybook-shadow {
      box-shadow: 0 14px 30px -6px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.06);
    }
    @keyframes popBounce {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: popBounce 0.25s ease-out;
    }
  </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- TOP HEADER -->
  <header class="w-full max-w-2xl mx-auto flex items-center justify-between gap-3 pt-1 pb-2">
    <!-- Home Button -->
    <button id="homeBtn" onclick="goHome()" aria-label="Home"
            class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white border-4 border-amber-200 hover:border-amber-400 shadow-md flex items-center justify-center text-2xl sm:text-3xl transition transform active:scale-90 shrink-0">
      🇫🇷
    </button>

    <!-- Dynamic Title -->
    <div class="text-center flex-1 min-w-0">
      <h1 id="headerTitle" class="text-2xl sm:text-3xl font-black text-slate-800 tracking-wide truncate">
        Apprendre le Français
      </h1>
      <p id="headerSubtitle" class="text-xs sm:text-sm font-bold text-amber-700 truncate">
        Tap a module to start learning!
      </p>
    </div>

    <!-- Settings Button -->
    <button id="settingsBtn" onclick="openSettings()" aria-label="Settings"
            class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white border-4 border-amber-200 hover:border-amber-400 shadow-md flex items-center justify-center text-2xl sm:text-3xl text-slate-700 transition transform active:scale-90 shrink-0">
      ⚙️
    </button>
  </header>

  <!-- HOME MODULE GRID -->
  <main class="w-full max-w-2xl mx-auto flex-1 flex flex-col justify-center my-2">
    <section id="homeSection" class="w-full">
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">

        <!-- TILE 1: COULEURS -->
        <button onclick="selectModule('colors')" 
                class="bg-gradient-to-br from-rose-500 to-orange-500 hover:from-rose-600 hover:to-orange-600 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">🎨</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Couleurs</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">Colors</p>
        </button>

        <!-- TILE 2: VOCABULAIRE -->
        <button onclick="selectModule('vocab')" 
                class="bg-gradient-to-br from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">🦁</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Vocabulaire</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">Words A–Z</p>
        </button>

        <!-- TILE 3: JOURS DE LA SEMAINE -->
        <button onclick="selectModule('days')" 
                class="bg-gradient-to-br from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">📅</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Jours</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">Days of Week</p>
        </button>

        <!-- TILE 4: NOMBRES -->
        <button onclick="selectModule('numbers')" 
                class="bg-gradient-to-br from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">🔢</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Nombres</h2>
          <p id="homeNumbersSub" class="text-xs sm:text-sm font-bold text-white/90 mt-1">Numbers 1–10</p>
        </button>

        <!-- TILE 5: ALPHABET -->
        <button onclick="selectModule('alphabet')" 
                class="bg-gradient-to-br from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">🔤</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Alphabet</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">Letters A–Z</p>
        </button>

        <!-- TILE 6: LES QUATRE SAISONS -->
        <button onclick="selectModule('seasons')" 
                class="bg-gradient-to-br from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">🌸</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Saisons</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">4 Seasons</p>
        </button>

        <!-- TILE 7: SALUTATIONS (GREETINGS) -->
        <button onclick="selectModule('greetings')" 
                class="bg-gradient-to-br from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">👋</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Salutations</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">Greetings</p>
        </button>

        <!-- TILE 8: LECTURE (READING FOR KIDS) -->
        <button onclick="selectModule('reading')" 
                class="col-span-2 sm:col-span-2 bg-gradient-to-r from-cyan-500 via-teal-500 to-emerald-500 hover:from-cyan-600 hover:via-teal-600 hover:to-emerald-600 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-5 text-center sm:text-left transition transform hover:-translate-y-1 active:scale-95">
          <span class="text-5xl sm:text-6xl filter drop-shadow shrink-0">📖</span>
          <div>
            <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Je Lis (Reading)</h2>
            <p id="homeReadingSub" class="text-xs sm:text-sm font-bold text-white/95 mt-1">Syllables • Words • Sentences</p>
          </div>
        </button>

      </div>
    </section>

    <!-- LEARNING FLASHCARD SECTION -->
    <section id="learnSection" class="hidden w-full flex flex-col items-center justify-center">
      
      <!-- FLASHCARD CONTAINER -->
      <div id="flashcard" onclick="speakCurrentItem()"
           class="w-full max-w-md min-h-[23rem] sm:min-h-[26rem] rounded-3xl border-8 storybook-shadow transition-all duration-200 transform active:scale-98 cursor-pointer relative flex flex-col items-center justify-center p-6 text-center overflow-hidden">
        
        <!-- Visual / Icon / SVG / Big Digit Container -->
        <div id="cardVisualContainer" class="mb-3 flex items-center justify-center"></div>

        <!-- Primary French Word / Letter / Number -->
        <h2 id="cardPrimaryText" class="font-black tracking-wide leading-tight mb-3"></h2>

        <!-- Interactive Syllables / Word Breakdown for Reading Module -->
        <div id="readingBreakdown" class="hidden flex flex-wrap items-center justify-center gap-2 mb-3"></div>

        <!-- Helper Box (English Translation + Phonetics) -->
        <div id="cardHelperBox" class="px-5 py-3 rounded-2xl border-2 mt-1 max-w-full">
          <p id="cardEnglishText" class="text-xl sm:text-3xl font-bold"></p>
          <p id="cardPhoneticText" class="text-sm sm:text-base font-semibold italic mt-0.5"></p>
        </div>
      </div>

      <!-- ICON-ONLY NAVIGATION CONTROLS (Android-Safe, No Text Labels) -->
      <div class="w-full max-w-md grid grid-cols-3 gap-3 sm:gap-4 mt-5">
        <!-- Previous Button -->
        <button onclick="prevCard()" aria-label="Previous"
                class="h-16 sm:h-20 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white border-b-4 border-sky-700 active:border-b-0 active:translate-y-1 shadow-lg flex items-center justify-center transition">
          <svg class="w-8 h-8 sm:w-9 sm:h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>

        <!-- Random / Shuffle Button -->
        <button onclick="randomCard()" aria-label="Random"
                class="h-16 sm:h-20 rounded-2xl bg-purple-500 hover:bg-purple-600 text-white border-b-4 border-purple-700 active:border-b-0 active:translate-y-1 shadow-lg flex items-center justify-center transition">
          <span class="text-3xl sm:text-4xl leading-none">🎲</span>
        </button>

        <!-- Next Button -->
        <button onclick="nextCard()" aria-label="Next"
                class="h-16 sm:h-20 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1 shadow-lg flex items-center justify-center transition">
          <svg class="w-8 h-8 sm:w-9 sm:h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </section>
  </main>

  <!-- FOOTER -->
  <footer class="w-full max-w-2xl mx-auto text-center text-xs font-bold text-amber-800/60 py-1">
    Tap any card to hear French pronunciation 🔊
  </footer>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md p-6 border-4 border-amber-300 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
      
      <div class="flex items-center justify-between border-b-2 border-slate-100 pb-3">
        <h3 class="text-2xl font-black text-slate-800 flex items-center gap-2">
          <span>⚙️</span> Settings
        </h3>
        <button onclick="closeSettings()" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xl flex items-center justify-center">
          ✕
        </button>
      </div>

      <!-- MODULE-SPECIFIC OPTIONS -->
      <!-- 1. Numbers Range -->
      <div id="settingNumbersGroup" class="hidden space-y-2 bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-200">
        <label class="block text-sm font-black text-emerald-900 uppercase tracking-wide">
          🔢 Numbers Range
        </label>
        <div class="grid grid-cols-2 gap-2">
          <button id="btnRange10" onclick="setNumberRange('1-10')"
                  class="py-2.5 px-3 rounded-xl font-bold text-sm border-2 transition">
            1 – 10
          </button>
          <button id="btnRange20" onclick="setNumberRange('1-20')"
                  class="py-2.5 px-3 rounded-xl font-bold text-sm border-2 transition">
            1 – 20
          </button>
        </div>
      </div>

      <!-- 2. Alphabet Pronunciation Mode -->
      <div id="settingAlphabetGroup" class="hidden space-y-2 bg-purple-50 p-4 rounded-2xl border-2 border-purple-200">
        <label class="block text-sm font-black text-purple-900 uppercase tracking-wide">
          🔤 Alphabet Pronunciation
        </label>
        <div class="grid grid-cols-2 gap-2">
          <button id="btnAlphaPhonic" onclick="setAlphabetMode('phonic')"
                  class="py-2.5 px-3 rounded-xl font-bold text-sm border-2 transition">
            Phonic Sound
          </button>
          <button id="btnAlphaName" onclick="setAlphabetMode('name')"
                  class="py-2.5 px-3 rounded-xl font-bold text-sm border-2 transition">
            Letter Name
          </button>
        </div>
      </div>

      <!-- 3. Reading Level -->
      <div id="settingReadingGroup" class="hidden space-y-2 bg-cyan-50 p-4 rounded-2xl border-2 border-cyan-200">
        <label class="block text-sm font-black text-cyan-900 uppercase tracking-wide">
          📖 Reading Level
        </label>
        <div class="grid grid-cols-3 gap-2">
          <button id="btnRead1" onclick="setReadingLevel(1)"
                  class="py-2.5 px-2 rounded-xl font-bold text-xs sm:text-sm border-2 transition">
            Lvl 1: Syllables
          </button>
          <button id="btnRead2" onclick="setReadingLevel(2)"
                  class="py-2.5 px-2 rounded-xl font-bold text-xs sm:text-sm border-2 transition">
            Lvl 2: Words
          </button>
          <button id="btnRead3" onclick="setReadingLevel(3)"
                  class="py-2.5 px-2 rounded-xl font-bold text-xs sm:text-sm border-2 transition">
            Lvl 3: Sentences
          </button>
        </div>
      </div>

      <!-- GENERAL OPTIONS -->
      <div class="space-y-4">
        <!-- Letter Case Mode (Default: Lowercase 'abc') -->
        <div class="space-y-2">
          <label class="block text-sm font-black text-slate-700 uppercase tracking-wide">
            🔡 Letter Case
          </label>
          <div class="grid grid-cols-3 gap-2">
            <button id="btnCaseLower" onclick="setLetterCase('lower')"
                    class="py-2.5 px-3 rounded-xl font-black text-base border-2 transition">
              abc
            </button>
            <button id="btnCaseUpper" onclick="setLetterCase('upper')"
                    class="py-2.5 px-3 rounded-xl font-black text-base border-2 transition">
              ABC
            </button>
            <button id="btnCaseBoth" onclick="setLetterCase('both')"
                    class="py-2.5 px-3 rounded-xl font-black text-base border-2 transition">
              Aa
            </button>
          </div>
        </div>

        <!-- Voice Speed -->
        <div class="space-y-2">
          <label class="block text-sm font-black text-slate-700 uppercase tracking-wide">
            🐢 Voice Speed
          </label>
          <div class="grid grid-cols-2 gap-2">
            <button id="btnSpeedSlow" onclick="setVoiceSpeed(0.65)"
                    class="py-2.5 px-3 rounded-xl font-bold text-sm border-2 transition">
              🐢 Slow
            </button>
            <button id="btnSpeedNormal" onclick="setVoiceSpeed(0.85)"
                    class="py-2.5 px-3 rounded-xl font-bold text-sm border-2 transition">
              🐇 Normal
            </button>
          </div>
        </div>

        <!-- Auto-Play Audio Toggle -->
        <div class="flex items-center justify-between bg-slate-50 p-3.5 rounded-2xl border-2 border-slate-200">
          <div>
            <p class="font-bold text-slate-800 text-sm">Auto-Speak on Next Card</p>
            <p class="text-xs text-slate-500">Read automatically when changing cards</p>
          </div>
          <button id="btnAutoPlay" onclick="toggleAutoPlay()"
                  class="w-14 h-8 rounded-full transition-colors p-1 flex items-center">
            <span id="autoPlayKnob" class="w-6 h-6 rounded-full bg-white shadow transform transition-transform"></span>
          </button>
        </div>
      </div>

      <!-- Done Button -->
      <button onclick="closeSettings()"
              class="w-full py-3.5 rounded-2xl bg-amber-400 hover:bg-amber-500 text-slate-900 font-black text-lg border-b-4 border-amber-600 active:border-b-0 active:translate-y-0.5 transition">
        Done
      </button>

    </div>
  </div>

  <script>
    // ==========================================
    // 1. STATE & DEFAULTS
    // ==========================================
    let currentView = 'home';
    let currentModule = null;
    let currentIndex = 0;
    let activeDataset = [];

    // User Preferences (Defaults: lowercase 'abc', phonic alphabet, 1-10 numbers)
    let letterCaseMode = 'lower';     // 'lower' | 'upper' | 'both'
    let alphabetSoundMode = 'phonic'; // 'phonic' | 'name'
    let numberRangeMode = '1-10';     // '1-10' | '1-20'
    let readingLevel = 1;             // 1 | 2 | 3
    let speechRate = 0.85;
    let autoPlayAudio = true;
    let pendingSpeakOnClose = false;
    let frenchVoice = null;

    // ==========================================
    // 2. SVG ARTWORK FOR SEASONS
    // ==========================================
    const svgArtwork = {
      spring: `<svg class="w-24 h-24 sm:w-28 sm:h-28 drop-shadow" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="14" fill="#FACC15"/>
        <circle cx="50" cy="24" r="14" fill="#F472B6"/>
        <circle cx="74" cy="40" r="14" fill="#F472B6"/>
        <circle cx="65" cy="70" r="14" fill="#F472B6"/>
        <circle cx="35" cy="70" r="14" fill="#F472B6"/>
        <circle cx="26" cy="40" r="14" fill="#F472B6"/>
        <circle cx="50" cy="50" r="11" fill="#FDE047"/>
      </svg>`,
      summer: `<svg class="w-24 h-24 sm:w-28 sm:h-28 drop-shadow" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="24" fill="#FDE047" stroke="#FEF08A" stroke-width="4"/>
        <g stroke="#FEF08A" stroke-width="6" stroke-linecap="round">
          <line x1="50" y1="10" x2="50" y2="20"/>
          <line x1="50" y1="80" x2="50" y2="90"/>
          <line x1="10" y1="50" x2="20" y2="50"/>
          <line x1="80" y1="50" x2="90" y2="50"/>
          <line x1="22" y1="22" x2="29" y2="29"/>
          <line x1="71" y1="71" x2="78" y2="78"/>
          <line x1="78" y1="22" x2="71" y2="29"/>
          <line x1="29" y1="71" x2="22" y2="78"/>
        </g>
      </svg>`,
      autumn: `<svg class="w-24 h-24 sm:w-28 sm:h-28 drop-shadow" viewBox="0 0 100 100">
        <path d="M50 15 C75 35, 80 65, 50 80 C20 65, 25 35, 50 15 Z" fill="#FDBA74" stroke="#FFF7ED" stroke-width="3"/>
        <line x1="50" y1="25" x2="50" y2="90" stroke="#7C2D12" stroke-width="5" stroke-linecap="round"/>
        <line x1="50" y1="45" x2="36" y2="35" stroke="#7C2D12" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="55" x2="64" y2="45" stroke="#7C2D12" stroke-width="3" stroke-linecap="round"/>
      </svg>`,
      winter: `<svg class="w-24 h-24 sm:w-28 sm:h-28 drop-shadow" viewBox="0 0 100 100">
        <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
          <line x1="50" y1="14" x2="50" y2="86"/>
          <line x1="14" y1="50" x2="86" y2="50"/>
          <line x1="25" y1="25" x2="75" y2="75"/>
          <line x1="75" y1="25" x2="25" y2="75"/>
        </g>
        <circle cx="50" cy="50" r="10" fill="#BAE6FD"/>
      </svg>`
    };

    // ==========================================
    // 3. DATASETS
    // ==========================================
    const colorsDataset = [
      { french: "Rouge", english: "Red", phonetic: "/roozh/", hex: "#EF4444", textDark: false },
      { french: "Bleu", english: "Blue", phonetic: "/bluh/", hex: "#3B82F6", textDark: false },
      { french: "Jaune", english: "Yellow", phonetic: "/zhohn/", hex: "#FACC15", textDark: true },
      { french: "Vert", english: "Green", phonetic: "/vair/", hex: "#22C55E", textDark: false },
      { french: "Orange", english: "Orange", phonetic: "/oh-rahnzh/", hex: "#F97316", textDark: false },
      { french: "Violet", english: "Purple", phonetic: "/vyoh-lay/", hex: "#8B5CF6", textDark: false },
      { french: "Rose", english: "Pink", phonetic: "/rohz/", hex: "#F472B6", textDark: false },
      { french: "Marron", english: "Brown", phonetic: "/mah-rohn/", hex: "#92400E", textDark: false },
      { french: "Noir", english: "Black", phonetic: "/nwahr/", hex: "#1E293B", textDark: false },
      { french: "Blanc", english: "White", phonetic: "/blahn/", hex: "#FFFFFF", textDark: true },
      { french: "Gris", english: "Gray", phonetic: "/gree/", hex: "#64748B", textDark: false }
    ];

    const seasonsDataset = [
      { french: "Le Printemps", english: "Spring", phonetic: "/luh pran-tahn/", hex: "#16A34A", svg: svgArtwork.spring },
      { french: "L'Été", english: "Summer", phonetic: "/lay-tay/", hex: "#F59E0B", svg: svgArtwork.summer },
      { french: "L'Automne", english: "Autumn / Fall", phonetic: "/loh-tohn/", hex: "#EA580C", svg: svgArtwork.autumn },
      { french: "L'Hiver", english: "Winter", phonetic: "/lee-vair/", hex: "#0284C7", svg: svgArtwork.winter }
    ];

    const greetingsDataset = [
      { french: "Bonjour", english: "Hello / Good morning", phonetic: "/bohn-zhoor/", hex: "#0EA5E9", icon: "👋" },
      { french: "Salut", english: "Hi / Bye (friendly)", phonetic: "/sah-loo/", hex: "#F43F5E", icon: "😊" },
      { french: "Bonsoir", english: "Good evening", phonetic: "/bohn-swahr/", hex: "#8B5CF6", icon: "🌆" },
      { french: "Bonne nuit", english: "Good night", phonetic: "/bon nwee/", hex: "#3B82F6", icon: "🌙" },
      { french: "Au revoir", english: "Goodbye", phonetic: "/oh ruh-vwahr/", hex: "#10B981", icon: "👋" },
      { french: "À bientôt", english: "See you soon", phonetic: "/ah byan-toh/", hex: "#F59E0B", icon: "🤗" },

    // ==========================================
    // 4. SPEECH SYNTHESIS & PHONETIC HELPERS
    // ==========================================
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      const load = () => {
        const voices = window.speechSynthesis.getVoices();
        frenchVoice = voices.find(v => v.lang === 'fr-CA') ||
                      voices.find(v => v.lang.startsWith('fr')) ||
                      null;
      };
      load();
      window.speechSynthesis.onvoiceschanged = load;
    }

    // Phonetic map for single letters/syllables in Level 1 Reading so 'é' doesn't say "e accent aigu"
    const readingChunkPhonics = {
      'a': 'ah',
      'é': 'hé',
      'e': 'euh',
      'i': 'ee',
      'o': 'oh',
      'u': 'u',
      'b': 'beu',
      'f': 'feuh',
      'l': 'leuh',
      'm': 'meuh',
      'p': 'peu',
      'r': 'reuh',
      's': 'seuh',
      'v': 'veuh'
    };

    function speakText(textToSpeak) {
      if (!('speechSynthesis' in window) || !textToSpeak) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'fr-FR';
        if (frenchVoice) utterance.voice = frenchVoice;
        utterance.rate = speechRate;
        utterance.pitch = 1.05;
        window.speechSynthesis.speak(utterance);
      } catch (err) {
        console.warn("Speech synthesis unavailable:", err);
      }
    }

    function speakCurrentItem() {
      const item = activeDataset[currentIndex];
      if (!item) return;

      if (currentModule === 'alphabet') {
        if (alphabetSoundMode === 'phonic') {
          if (item.silent) return; // Silent 'H' makes no sound in phonic mode
          speakText(item.soundSpeak);
        } else {
          speakText(item.nameSpeak);
        }
        return;
      }

      speakText(item.french);
    }

    // ==========================================
    // 5. CASE FORMATTING HELPER
    // ==========================================
    function formatTextByCase(text, isSingleAlphabetLetter = false) {
      if (!text) return "";
      if (isSingleAlphabetLetter) {
        const up = text.toUpperCase();
        const low = text.toLowerCase();
        if (letterCaseMode === 'upper') return up;
        if (letterCaseMode === 'both') return `${up} ${low}`;
        return low;
      }

      if (letterCaseMode === 'upper') {
        return text.toUpperCase();
      } else if (letterCaseMode === 'both') {
        // Title Case (capitalize first letter, lowercase rest)
        return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
      } else {
        return text.toLowerCase();
      }
    }

    // 6. NAVIGATION & RENDERING
    // ==========================================
    function goHome() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      currentView = 'home';
      currentModule = null;
      document.getElementById('learnSection').classList.add('hidden');
      document.getElementById('homeSection').classList.remove('hidden');
      document.getElementById('headerTitle').textContent = "Apprendre le Français";
      document.getElementById('headerSubtitle').textContent = "Tap a module to start learning!";
    }

    function updateNumberDataset() {
      activeDataset = numberRangeMode === '1-10'
        ? allNumbersDataset.slice(0, 10)
        : allNumbersDataset.slice(0, 20);
      document.getElementById('homeNumbersSub').textContent = `Numbers ${numberRangeMode}`;
      if (currentModule === 'numbers') {
        document.getElementById('headerSubtitle').textContent = `French Numbers (${numberRangeMode})`;
      }
    }

    function updateReadingDataset() {
      activeDataset = readingDatasets[readingLevel] || readingDatasets[1];
      if (currentModule === 'reading') {
        const subMap = {
          1: "Level 1: Syllables",
          2: "Level 2: Easy Words",
          3: "Level 3: Short Sentences"
        };
        document.getElementById('headerSubtitle').textContent = subMap[readingLevel];
      }
    }

    function selectModule(moduleKey) {
      currentView = 'module';
      currentModule = moduleKey;
      currentIndex = 0;

      document.getElementById('homeSection').classList.add('hidden');
      document.getElementById('learnSection').classList.remove('hidden');

      const titles = {
        colors: { title: "Couleurs", sub: "French Colors" },
        vocab: { title: "Vocabulaire", sub: "French Vocabulary (A–Z)" },
        days: { title: "Jours de la Semaine", sub: "Days of the Week" },
        numbers: { title: "Nombres", sub: `French Numbers (${numberRangeMode})` },
        alphabet: { title: "Alphabet", sub: "French Alphabet (A–Z)" },
        seasons: { title: "Les Quatre Saisons", sub: "The Four Seasons" },
        greetings: { title: "Salutations", sub: "French Greetings & Polite Words" },
        reading: { title: "Je Lis (Reading)", sub: readingLevel === 1 ? "Level 1: Syllables" : readingLevel === 2 ? "Level 2: Easy Words" : "Level 3: Short Sentences" }
      };

      document.getElementById('headerTitle').textContent = titles[moduleKey].title;
      document.getElementById('headerSubtitle').textContent = titles[moduleKey].sub;

      if (moduleKey === 'colors') activeDataset = colorsDataset;
      else if (moduleKey === 'vocab') activeDataset = vocabDataset;
      else if (moduleKey === 'days') activeDataset = daysDataset;
      else if (moduleKey === 'numbers') updateNumberDataset();
      else if (moduleKey === 'alphabet') activeDataset = alphabetDataset;
      else if (moduleKey === 'seasons') activeDataset = seasonsDataset;
      else if (moduleKey === 'greetings') activeDataset = greetingsDataset;
      else if (moduleKey === 'reading') updateReadingDataset();

      updateDisplay(autoPlayAudio);
    }

    function updateDisplay(shouldSpeak = false) {
      const item = activeDataset[currentIndex];
      if (!item) return;

      const helperBox = document.getElementById('cardHelperBox');
      const englishText = document.getElementById('cardEnglishText');

      // Re-trigger pop animation
      card.classList.remove('animate-pop');
      void card.offsetWidth;
      card.classList.add('animate-pop');

      visualContainer.innerHTML = '';
      visualContainer.classList.add('hidden');
      readingBreakdown.innerHTML = '';
      readingBreakdown.classList.add('hidden');

      if (isFullColorCard) {
        // FULL-SCREEN COLORFUL BACKGROUND FOR COLORS & SEASONS
        card.style.backgroundColor = item.hex;
        card.style.borderColor = item.hex === '#FFFFFF' ? '#CBD5E1' : '#FFFFFF';

        primaryText.className = `text-5xl sm:text-6xl font-black tracking-wide leading-tight mb-4 ${useDarkText ? 'text-slate-800' : 'text-white drop-shadow'}`;
        primaryText.textContent = formatTextByCase(item.french);

          visualContainer.innerHTML = item.svg;
          visualContainer.classList.remove('hidden');

        phoneticText.className = `text-sm sm:text-base font-semibold italic mt-0.5 ${useDarkText ? 'text-slate-600' : 'text-white/90'}`;
        englishText.textContent = item.english;
        phoneticText.textContent = item.phonetic;

      } else {
        // STORYBOOK CARD STYLE (Warm Ivory Background + Dynamic Colored Border)
        const borderHex = item.hex || '#38BDF8';
        card.style.backgroundColor = '#FFFDF9';
        card.style.borderColor = borderHex;

            ? 'text-3xl sm:text-4xl font-black tracking-wide leading-snug mb-3 text-slate-800'
            : 'text-5xl sm:text-6xl font-black tracking-wide leading-tight mb-3 text-slate-800';
          primaryText.textContent = formatTextByCase(item.french);

          // Interactive Syllable/Letter Pills for Level 1 & Level 2
          if (item.parts && item.parts.length > 0) {
            readingBreakdown.classList.remove('hidden');
            item.parts.forEach((part, idx) => {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'px-4 py-2 rounded-2xl bg-white border-2 border-slate-300 hover:border-cyan-500 shadow-sm text-2xl sm:text-3xl font-black text-slate-800 active:scale-90 transition';
              btn.textContent = formatTextByCase(part);
              btn.onclick = (e) => {
                e.stopPropagation();
                const lowerPart = part.toLowerCase();
                const speakChunk = (readingLevel === 1 && readingChunkPhonics[lowerPart])
                  ? readingChunkPhonics[lowerPart]
                  : part;
                speakText(speakChunk);
              };
              readingBreakdown.appendChild(btn);

              if (readingLevel === 1 && idx < item.parts.length - 1) {
                const plus = document.createElement('span');
                plus.className = 'text-xl sm:text-2xl font-black text-slate-400';
                plus.textContent = '+';
                readingBreakdown.appendChild(plus);
              }
            });
          }

          englishText.textContent = item.english;
          phoneticText.textContent = item.phonetic;

        } else {
          // Vocabulaire, Jours, Salutations
          if (item.icon) {
            visualContainer.innerHTML = `<span class="text-7xl sm:text-8xl filter drop-shadow-sm">${item.icon}</span>`;
            visualContainer.classList.remove('hidden');
          }

          const isLongPhrase = item.french.length > 12;
          primaryText.className = isLongPhrase
            ? 'text-3xl sm:text-5xl font-black tracking-wide leading-tight mb-4 text-slate-800'
            : 'text-5xl sm:text-6xl font-black tracking-wide leading-tight mb-4 text-slate-800';
          primaryText.textContent = formatTextByCase(item.french);

          englishText.textContent = item.english;
          phoneticText.textContent = item.phonetic;
        }
      }

      if (shouldSpeak) {
        speakCurrentItem();
      }
    }

    function nextCard() {
      if (!activeDataset.length) return;
      currentIndex = (currentIndex + 1) % activeDataset.length;
      updateDisplay(autoPlayAudio);
    }

    function prevCard() {
      if (!activeDataset.length) return;
      currentIndex = (currentIndex - 1 + activeDataset.length) % activeDataset.length;
      updateDisplay(autoPlayAudio);
    }

    function randomCard() {
      if (activeDataset.length <= 1) {
        updateDisplay(autoPlayAudio);
        return;
      }
      let nextIdx = currentIndex;
      while (nextIdx === currentIndex) {
        nextIdx = Math.floor(Math.random() * activeDataset.length);
      }
      currentIndex = nextIdx;
      updateDisplay(autoPlayAudio);
    }

    // ==========================================
    // 7. SETTINGS MODAL CONTROLS
    // ==========================================
    function openSettings() {
      pendingSpeakOnClose = false;

      // Show module-specific groups only when inside that module
      document.getElementById('settingNumbersGroup').classList.toggle('hidden', currentModule !== 'numbers');
      document.getElementById('settingAlphabetGroup').classList.toggle('hidden', currentModule !== 'alphabet');
      document.getElementById('settingReadingGroup').classList.toggle('hidden', currentModule !== 'reading');

      syncSettingsUI();
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
      if (pendingSpeakOnClose && currentView === 'module') {
        pendingSpeakOnClose = false;
        speakCurrentItem();
      }
    }

    function syncSettingsUI() {
      const activeClasses = ['bg-amber-400', 'border-amber-600', 'text-slate-900'];
      const inactiveClasses = ['bg-white', 'border-slate-200', 'text-slate-600'];

      const applyToggleStyle = (elId, isActive) => {
        const el = document.getElementById(elId);
        if (!el) return;
        el.classList.remove(...activeClasses, ...inactiveClasses);
        el.classList.add(...(isActive ? activeClasses : inactiveClasses));
      };

      // Letter Case
      applyToggleStyle('btnCaseLower', letterCaseMode === 'lower');
      applyToggleStyle('btnCaseUpper', letterCaseMode === 'upper');
      applyToggleStyle('btnCaseBoth', letterCaseMode === 'both');

      // Voice Speed
      applyToggleStyle('btnSpeedSlow', speechRate === 0.65);
      applyToggleStyle('btnSpeedNormal', speechRate === 0.85);

      // Numbers Range
      applyToggleStyle('btnRange10', numberRangeMode === '1-10');
      applyToggleStyle('btnRange20', numberRangeMode === '1-20');

      // Alphabet Sound Mode
      applyToggleStyle('btnAlphaPhonic', alphabetSoundMode === 'phonic');
      applyToggleStyle('btnAlphaName', alphabetSoundMode === 'name');

      // Reading Level
      applyToggleStyle('btnRead1', readingLevel === 1);
      applyToggleStyle('btnRead2', readingLevel === 2);
      applyToggleStyle('btnRead3', readingLevel === 3);

      // Auto-Play Toggle
      const autoBtn = document.getElementById('btnAutoPlay');
      const autoKnob = document.getElementById('autoPlayKnob');
      if (autoPlayAudio) {
        autoBtn.classList.remove('bg-slate-300');
        autoBtn.classList.add('bg-emerald-500');
        autoKnob.classList.add('translate-x-6');
      } else {
        autoBtn.classList.remove('bg-emerald-500');
        autoBtn.classList.add('bg-slate-300');
        autoKnob.classList.remove('translate-x-6');
      }
    }

    function setLetterCase(mode) {
      letterCaseMode = mode;
      syncSettingsUI();
      if (currentView === 'module') {
        updateDisplay(false);
      }
    }

    function setVoiceSpeed(rate) {
      speechRate = rate;
      syncSettingsUI();
      if (currentView === 'module') {
        pendingSpeakOnClose = true;
      }
    }

    function setNumberRange(range) {
      numberRangeMode = range;
      currentIndex = 0;
      updateNumberDataset();
      syncSettingsUI();
      if (currentModule === 'numbers') {
        updateDisplay(false);
        pendingSpeakOnClose = true;
      }
    }

    function setAlphabetMode(mode) {
      alphabetSoundMode = mode;
      syncSettingsUI();
      if (currentModule === 'alphabet') {
        updateDisplay(false);
        pendingSpeakOnClose = true;
      }
    }

    function setReadingLevel(level) {
      readingLevel = level;
      currentIndex = 0;
      updateReadingDataset();
      syncSettingsUI();
      if (currentModule === 'reading') {
        updateDisplay(false);
        pendingSpeakOnClose = true;
      }
    }

    function toggleAutoPlay() {
      autoPlayAudio = !autoPlayAudio;
      syncSettingsUI();
    }

    // Initialize voices on load
    window.addEventListener('DOMContentLoaded', () => {
      initVoices();
      syncSettingsUI();
    });
  </script>
</body>
</html>
