<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Learning for Kids</title>
  
  <!-- PWA Settings for Mobile/Android -->
  <meta name="theme-color" content="#fef3c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="French Kids">
  
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      touch-action: manipulation;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col justify-between text-slate-800 select-none relative overflow-x-hidden">

  <!-- SLIDE-OUT MENU OVERLAY -->
  <div id="menuOverlay" onclick="closeMenu()" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 transition-opacity duration-300 opacity-0 pointer-events-none"></div>

  <aside id="menuDrawer" class="fixed top-0 left-0 bottom-0 w-80 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out p-5 flex flex-col justify-between overflow-y-auto">
    <div>
      <div class="flex items-center justify-between pb-4 border-b border-amber-200 mb-6">
        <div class="flex items-center space-x-3">
          <span class="text-4xl">🇫🇷</span>
          <div>
            <h2 class="text-lg font-black text-amber-600">Menu Principal</h2>
            <p class="text-xs text-amber-800 font-bold">Options & Modules</p>
          </div>
        </div>
        <button onclick="closeMenu()" class="text-slate-400 hover:text-slate-600 p-2 rounded-xl text-xl font-bold">
          ✕
        </button>
      </div>

      <!-- MODULE SELECTION LIST -->
      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Modules</p>
      <nav class="space-y-3 mb-6">
        <!-- COLORS MODULE BUTTON -->
        <button id="modColorsBtn" onclick="selectModule('colors')" 
                class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-bold text-left transition-all bg-amber-500 text-white shadow-md">
          <span class="text-2xl">🎨</span>
          <div>
            <div class="text-base leading-tight">Couleurs</div>
            <div class="text-xs font-normal opacity-80">French Colors</div>
          </div>
        </button>

        <!-- NUMBERS MODULE CONTAINER -->
        <div class="bg-amber-50/80 rounded-2xl p-2 border border-amber-200">
          <button id="modNumbersBtn" onclick="selectModule('numbers')" 
                  class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl font-bold text-left text-slate-700 hover:bg-amber-100 transition-all">
            <span class="text-2xl">🔢</span>
            <div>
              <div class="text-base leading-tight">Nombres</div>
              <div class="text-xs font-normal opacity-70">French Numbers</div>
            </div>
          </button>

          <!-- NUMBER RANGE SELECTORS -->
          <div class="mt-2 grid grid-cols-3 gap-1 pt-2 border-t border-amber-200/60">
            <button id="range1-10Btn" onclick="setNumberRange('1-10')" class="py-1.5 px-1 rounded-lg text-xs font-bold bg-amber-500 text-white transition text-center shadow-sm">
              1 – 10
            </button>
            <button id="range11-20Btn" onclick="setNumberRange('11-20')" class="py-1.5 px-1 rounded-lg text-xs font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center">
              11 – 20
            </button>
            <button id="range1-20Btn" onclick="setNumberRange('1-20')" class="py-1.5 px-1 rounded-lg text-xs font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center">
              1 – 20
            </button>
          </div>
        </div>

        <!-- ALPHABET MODULE BUTTON -->
        <button id="modAlphabetBtn" onclick="selectModule('alphabet')" 
                class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-bold text-left text-slate-700 hover:bg-amber-100 transition-all">
          <span class="text-2xl">🔤</span>
          <div>
            <div class="text-base leading-tight">Alphabet</div>
            <div class="text-xs font-normal opacity-80">French Alphabet</div>
          </div>
        </button>
      </nav>

      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Settings</p>
      <div class="space-y-2 mb-6">
        <!-- ENGLISH HELPER TOGGLE -->
        <button id="toggleEnglishBtn" onclick="toggleEnglish()" 
                class="w-full flex items-center justify-between px-4 py-3 bg-blue-50 text-blue-800 hover:bg-blue-100 rounded-2xl font-semibold text-sm transition">
          <span class="flex items-center space-x-2">
            <i class="fas fa-language text-lg text-blue-600"></i>
            <span>English Helper</span>
          </span>
          <span id="englishStatusBadge" class="text-xs bg-blue-200 text-blue-900 font-bold px-2 py-0.5 rounded-full">ON</span>
        </button>

        <!-- SPEAK ON NAVIGATE TOGGLE -->
        <button id="toggleAutoAudioBtn" onclick="toggleAutoAudio()" 
                class="w-full flex items-center justify-between px-4 py-3 bg-amber-100 text-amber-900 hover:bg-amber-200 rounded-2xl font-semibold text-sm transition">
          <span class="flex items-center space-x-2">
            <i id="audioMenuIcon" class="fas fa-volume-up text-lg text-amber-600"></i>
            <span>Speak on Navigate</span>
          </span>
          <span id="audioStatusBadge" class="text-xs bg-amber-200 text-amber-900 font-bold px-2 py-0.5 rounded-full">ON</span>
        </button>

        <!-- VOICE SPEED SELECTOR -->
        <div class="p-3 bg-slate-100 rounded-2xl flex items-center justify-between text-xs text-slate-700">
          <span class="font-bold flex items-center space-x-1.5">
            <i class="fas fa-tachometer-alt text-amber-500 text-sm"></i>
            <span>Voice Speed</span>
          </span>
          <div class="flex bg-slate-200 p-1 rounded-xl space-x-1">
            <button id="speedSlowBtn" onclick="setSpeechRate(0.7)" class="px-2.5 py-1 rounded-lg font-bold transition text-xs text-slate-600">🐢 Slow</button>
            <button id="speedNormalBtn" onclick="setSpeechRate(0.85)" class="px-2.5 py-1 rounded-lg bg-white text-amber-700 shadow-sm font-bold transition text-xs">🧒 Normal</button>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- HEADER -->
  <header class="bg-white/80 backdrop-blur-md border-b-4 border-amber-200 sticky top-0 z-40 p-3 sm:p-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- ONLY FRENCH FLAG MENU TRIGGER BUTTON -->
        <button onclick="toggleMenu()" title="Open Menu" 
                class="p-2 sm:px-3 sm:py-2 bg-amber-100 hover:bg-amber-200 active:scale-95 text-amber-900 rounded-2xl flex items-center border-2 border-amber-300 transition shadow-sm cursor-pointer">
          <span class="text-3xl leading-none">🇫🇷</span>
        </button>

        <div>
          <h1 id="headerTitle" class="text-lg sm:text-2xl font-black text-amber-600 tracking-wide leading-tight">Couleurs en Français</h1>
          <p id="headerSubtitle" class="text-xs text-amber-800 font-bold hidden sm:block">French Colors for Kids</p>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-4xl mx-auto w-full">

    <!-- MODE SWITCH TABS (LEARN / QUIZ) -->
    <div class="flex bg-amber-200/60 p-1.5 rounded-3xl mb-4 space-x-2 border-2 border-amber-300">
      <button id="tabLearn" onclick="switchMode('learn')" 
              class="px-5 py-2 rounded-2xl font-bold text-lg transition-all duration-200 bg-white text-amber-700 shadow-md">
        📖 Learn Mode
      </button>
      <button id="tabQuiz" onclick="switchMode('quiz')" 
              class="px-5 py-2 rounded-2xl font-bold text-lg transition-all duration-200 text-amber-900 hover:bg-white/50">
        🎮 Mini Quiz
      </button>
    </div>

    <!-- LEARN MODE SECTION -->
    <section id="learnSection" class="w-full flex flex-col items-center">
      
      <!-- MAIN DISPLAY CARD -->
      <div id="displayCard" 
           onclick="handleCardClick(event)" 
           class="w-full max-w-md h-80 sm:h-[28rem] rounded-3xl border-8 border-white custom-shadow transition-all duration-300 transform active:scale-95 cursor-pointer relative flex flex-col items-center justify-center p-6 text-center overflow-hidden group">
        
        <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>

        <!-- French Primary Text Display -->
        <h2 id="frenchName" class="text-6xl sm:text-8xl font-black tracking-wide drop-shadow-md text-white mb-4 transition-all">
          Rouge
        </h2>

        <!-- English Translation & Phonetics -->
        <div id="englishContainer" class="bg-black/30 backdrop-blur-md px-6 py-3 rounded-2xl text-white mt-2 transition-all">
          <p id="englishName" class="text-2xl sm:text-4xl font-bold">Red</p>
          <p id="phoneticText" class="text-sm sm:text-lg font-semibold opacity-85 italic mt-1">/roozh/</p>
        </div>
      </div>

      <!-- MAIN NAVIGATION CONTROLS -->
      <div class="w-full max-w-md mt-6 grid grid-cols-3 gap-3 sm:gap-4">
        
        <!-- PREVIOUS BUTTON -->
        <button onclick="prevItem()" 
                class="bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-black py-4 px-2 rounded-2xl border-b-4 border-sky-700 text-sm sm:text-base flex items-center justify-center space-x-2 shadow-lg transition transform active:translate-y-1">
          <i class="fas fa-chevron-left text-lg"></i>
          <span>Précédent</span>
        </button>

        <!-- RANDOM BUTTON -->
        <button onclick="randomItem()" 
                class="bg-purple-500 hover:bg-purple-600 active:bg-purple-700 text-white font-black py-4 px-2 rounded-2xl border-b-4 border-purple-800 text-xs sm:text-base flex items-center justify-center space-x-2 shadow-lg transition transform active:translate-y-1">
          <i class="fas fa-dice text-lg"></i>
          <span>Aléatoire</span>
        </button>

        <!-- NEXT BUTTON -->
        <button onclick="nextItem()" 
                class="bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-black py-4 px-2 rounded-2xl border-b-4 border-emerald-700 text-sm sm:text-base flex items-center justify-center space-x-2 shadow-lg transition transform active:translate-y-1">
          <span>Suivant</span>
          <i class="fas fa-chevron-right text-lg"></i>
        </button>
      </div>

    </section>

    <section id="quizSection" class="w-full flex flex-col items-center hidden">
      <div class="bg-white/90 rounded-3xl p-6 border-4 border-amber-200 w-full max-w-md text-center shadow-lg">
        
        <!-- Score Bar -->
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-amber-100">
          <span class="text-base font-bold text-amber-800">Score: <span id="quizScoreText" class="text-2xl font-black text-amber-600">0</span></span>
          <button onclick="resetQuizScore()" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1.5 rounded-xl font-bold">
            🔄 Reset
          </button>
        </div>

        <!-- Question Prompt -->
        <p class="text-sm font-semibold text-slate-500 mb-1">Find the matching item for:</p>
        <div class="flex items-center justify-center space-x-2 mb-6">
          <h3 id="quizQuestionText" class="text-3xl sm:text-4xl font-black text-slate-800">Rouge</h3>
          <button onclick="speakWord(currentQuizTarget ? currentQuizTarget.french : '')" class="p-2 bg-amber-100 text-amber-700 rounded-full hover:bg-amber-200 transition">
            <i class="fas fa-volume-up text-lg"></i>
          </button>
        </div>

        <!-- Quiz Choice Grid -->
        <div id="quizOptionsGrid" class="grid grid-cols-2 gap-4">
          <!-- Dynamically populated choices -->
        </div>

        <!-- Feedback Message Box -->
        <div id="quizFeedback" class="mt-4 min-h-[3rem] flex items-center justify-center font-bold text-lg rounded-2xl p-2 transition-all opacity-0">
        </div>
      </div>
    </section>

  </main>

  <script>
    // Register Service Worker for offline capability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swContent = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => new Response("Offline")));
          });
        `;
        const blob = new Blob([swContent], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW note:', err));
      });
    }

    // ==================== DATASETS ====================
    const colorsDataset = [
      { french: "Rouge", english: "Red", phonetic: "/roozh/", hex: "#EF4444", textDark: false },
      { french: "Bleu", english: "Blue", phonetic: "/bluh/", hex: "#3B82F6", textDark: false },
      { french: "Jaune", english: "Yellow", phonetic: "/zhohn/", hex: "#FACC15", textDark: true },
      { french: "Vert", english: "Green", phonetic: "/vair/", hex: "#22C55E", textDark: false },
      { french: "Orange", english: "Orange", phonetic: "/oh-rahnj/", hex: "#F97316", textDark: false },
      { french: "Rose", english: "Pink", phonetic: "/rohz/", hex: "#EC4899", textDark: false },
      { french: "Violet", english: "Purple", phonetic: "/vyoh-lay/", hex: "#A855F7", textDark: false },
      { french: "Noir", english: "Black", phonetic: "/nwahr/", hex: "#1E293B", textDark: false },
      { french: "Blanc", english: "White", phonetic: "/blahnk/", hex: "#FFFFFF", textDark: true, border: true },
      { french: "Gris", english: "Gray", phonetic: "/gree/", hex: "#64748B", textDark: false },
      { french: "Marron", english: "Brown", phonetic: "/mah-rohn/", hex: "#78350F", textDark: false }
    ];

    const numbersDatasetAll = [
      { french: "Un", english: "1", phonetic: "/uhn/", hex: "#3B82F6", num: 1 },
      { french: "Deux", english: "2", phonetic: "/duh/", hex: "#10B981", num: 2 },
      { french: "Trois", english: "3", phonetic: "/twah/", hex: "#F59E0B", num: 3 },
      { french: "Quatre", english: "4", phonetic: "/kat-ruh/", hex: "#EC4899", num: 4 },
      { french: "Cinq", english: "5", phonetic: "/sank/", hex: "#8B5CF6", num: 5 },
      { french: "Six", english: "6", phonetic: "/sees/", hex: "#EF4444", num: 6 },
      { french: "Sept", english: "7", phonetic: "/set/", hex: "#14B8A6", num: 7 },
      { french: "Huit", english: "8", phonetic: "/weet/", hex: "#F97316", num: 8 },
      { french: "Neuf", english: "9", phonetic: "/nuhf/", hex: "#6366F1", num: 9 },
      { french: "Dix", english: "10", phonetic: "/dees/", hex: "#84CC16", num: 10 },
      { french: "Onze", english: "11", phonetic: "/ohnz/", hex: "#06B6D4", num: 11 },
      { french: "Douze", english: "12", phonetic: "/doo-z/", hex: "#A855F7", num: 12 },
      { french: "Treize", english: "13", phonetic: "/trehz/", hex: "#EAB308", num: 13 },
      { french: "Quatorze", english: "14", phonetic: "/kah-torz/", hex: "#F43F5E", num: 14 },
      { french: "Quinze", english: "15", phonetic: "/kanz/", hex: "#10B981", num: 15 },
      { french: "Seize", english: "16", phonetic: "/sehz/", hex: "#3B82F6", num: 16 },
      { french: "Dix-sept", english: "17", phonetic: "/dees-set/", hex: "#D97706", num: 17 },
      { french: "Dix-huit", english: "18", phonetic: "/dees-weet/", hex: "#8B5CF6", num: 18 },
      { french: "Dix-neuf", english: "19", phonetic: "/dees-nuhf/", hex: "#EC4899", num: 19 },
      { french: "Vingt", english: "20", phonetic: "/van/", hex: "#059669", num: 20 }
    ];

    const alphabetDataset = [
      { french: "A", english: "Ah", phonetic: "/ah/", hex: "#EF4444" },
      { french: "B", english: "Baw", phonetic: "/bay/", hex: "#3B82F6" },
      { french: "C", english: "Say", phonetic: "/say/", hex: "#10B981" },
      { french: "D", english: "Day", phonetic: "/day/", hex: "#F59E0B" },
      { french: "E", english: "Euh", phonetic: "/uh/", hex: "#8B5CF6" },
      { french: "F", english: "Eff", phonetic: "/eff/", hex: "#EC4899" },
      { french: "G", english: "Zhey", phonetic: "/zhay/", hex: "#14B8A6" },
      { french: "H", english: "Ash", phonetic: "/ash/", hex: "#F97316" },
      { french: "I", english: "Eee", phonetic: "/ee/", hex: "#6366F1" },
      { french: "J", english: "Zhee", phonetic: "/zhee/", hex: "#84CC16" },
      { french: "K", english: "Kah", phonetic: "/kah/", hex: "#06B6D4" },
      { french: "L", english: "Ell", phonetic: "/ell/", hex: "#A855F7" },
      { french: "M", english: "Emm", phonetic: "/emm/", hex: "#EAB308" },
      { french: "N", english: "Enn", phonetic: "/enn/", hex: "#F43F5E" },
      { french: "O", english: "Oh", phonetic: "/oh/", hex: "#059669" },
      { french: "P", english: "Pay", phonetic: "/pay/", hex: "#D97706" },
      { french: "Q", english: "Koo", phonetic: "/koo/", hex: "#3B82F6" },
      { french: "R", english: "Air", phonetic: "/air/", hex: "#EF4444" },
      { french: "S", english: "Ess", phonetic: "/ess/", hex: "#10B981" },
      { french: "T", english: "Tay", phonetic: "/tay/", hex: "#8B5CF6" },
      { french: "U", english: "Eew", phonetic: "/oo/", hex: "#EC4899" },
      { french: "V", english: "Vey", phonetic: "/vay/", hex: "#14B8A6" },
      { french: "W", english: "Double Vey", phonetic: "/doo-bluh-vay/", hex: "#F97316" },
      { french: "X", english: "Eeks", phonetic: "/eeks/", hex: "#6366F1" },
      { french: "Y", english: "Eegrek", phonetic: "/ee-grek/", hex: "#84CC16" },
      { french: "Z", english: "Zed", phonetic: "/zed/", hex: "#06B6D4" }
    ];

    // App State Variables
    let currentModule = 'colors';
    let numberRangeMode = '1-10'; // Options: '1-10', '11-20', '1-20'
    let activeDataset = colorsDataset;
    
    let currentIndex = 0;
    let autoPlayAudio = true;
    let showEnglish = true;
    let speechRate = 0.85;
    let synth = window.speechSynthesis;
    let frenchVoice = null;
    let quizScore = 0;
    let currentQuizTarget = null;

    function initVoices() {
      if (!synth) return;
      let voices = synth.getVoices();
      frenchVoice = voices.find(v => v.lang.startsWith('fr') || v.lang.includes('FR')) || null;
    }

    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = initVoices;
    }

    // ==================== SLIDE-OUT MENU CONTROLS ====================
    function toggleMenu() {
      const drawer = document.getElementById('menuDrawer');
      const overlay = document.getElementById('menuOverlay');
      const isOpen = !drawer.classList.contains('-translate-x-full');

      if (isOpen) {
        closeMenu();
      } else {
        drawer.classList.remove('-translate-x-full');
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        overlay.classList.add('opacity-100');
      }
    }

    function closeMenu() {
      const drawer = document.getElementById('menuDrawer');
      const overlay = document.getElementById('menuOverlay');
      drawer.classList.add('-translate-x-full');
      overlay.classList.add('opacity-0', 'pointer-events-none');
      overlay.classList.remove('opacity-100');
    }

    // ==================== MODULE & RANGE SELECTION ====================
    function selectModule(moduleName) {
      currentModule = moduleName;
      currentIndex = 0;

      // Update button highlights
      document.getElementById('modColorsBtn').className = moduleName === 'colors' 
        ? "w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-bold text-left transition-all bg-amber-500 text-white shadow-md"
        : "w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-bold text-left text-slate-700 hover:bg-amber-100 transition-all";

      document.getElementById('modNumbersBtn').className = moduleName === 'numbers' 
        ? "w-full flex items-center space-x-3 px-3 py-2 rounded-xl font-bold text-left transition-all bg-amber-500 text-white shadow-sm"
        : "w-full flex items-center space-x-3 px-3 py-2 rounded-xl font-bold text-left text-slate-700 hover:bg-amber-100 transition-all";

      document.getElementById('modAlphabetBtn').className = moduleName === 'alphabet' 
        ? "w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-bold text-left transition-all bg-amber-500 text-white shadow-md"
        : "w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-bold text-left text-slate-700 hover:bg-amber-100 transition-all";

      const title = document.getElementById('headerTitle');
      const sub = document.getElementById('headerSubtitle');

      if (moduleName === 'colors') {
        activeDataset = colorsDataset;
        title.textContent = "Couleurs en Français";
        sub.textContent = "French Colors for Kids";
      } else if (moduleName === 'numbers') {
        updateNumberDataset();
        title.textContent = "Nombres en Français";
        sub.textContent = `French Numbers (${numberRangeMode})`;
      } else if (moduleName === 'alphabet') {
        activeDataset = alphabetDataset;
        title.textContent = "L'Alphabet Français";
        sub.textContent = "French Alphabet for Kids";
      }

      closeMenu();
      updateDisplay(false);
      
      if (!document.getElementById('quizSection').classList.contains('hidden')) {
        startNewQuizRound();
      }
    }

    function setNumberRange(rangeKey) {
      numberRangeMode = rangeKey;
      
      // Highlight active number sub-button
      const b1 = document.getElementById('range1-10Btn');
      const b2 = document.getElementById('range11-20Btn');
      const b3 = document.getElementById('range1-20Btn');

      b1.className = rangeKey === '1-10' 
        ? "py-1.5 px-1 rounded-lg text-xs font-bold bg-amber-500 text-white transition text-center shadow-sm"
        : "py-1.5 px-1 rounded-lg text-xs font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center";

      b2.className = rangeKey === '11-20' 
        ? "py-1.5 px-1 rounded-lg text-xs font-bold bg-amber-500 text-white transition text-center shadow-sm"
        : "py-1.5 px-1 rounded-lg text-xs font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center";

      b3.className = rangeKey === '1-20' 
        ? "py-1.5 px-1 rounded-lg text-xs font-bold bg-amber-500 text-white transition text-center shadow-sm"
        : "py-1.5 px-1 rounded-lg text-xs font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center";

      // If already in numbers module, apply changes immediately
      selectModule('numbers');
    }

    function updateNumberDataset() {
      if (numberRangeMode === '1-10') {
        activeDataset = numbersDatasetAll.slice(0, 10);
      } else if (numberRangeMode === '11-20') {
        activeDataset = numbersDatasetAll.slice(10, 20);
      } else {
        activeDataset = numbersDatasetAll.slice(0, 20);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initVoices();
      selectModule('colors');
    });

    // ==================== DISPLAY & NAVIGATION ====================
    function updateDisplay(shouldSpeak = autoPlayAudio) {
      if (!activeDataset || activeDataset.length === 0) return;

      const item = activeDataset[currentIndex];
      const card = document.getElementById('displayCard');
      const frenchText = document.getElementById('frenchName');
      const englishText = document.getElementById('englishName');
      const phoneticText = document.getElementById('phoneticText');

      card.style.backgroundColor = item.hex;

      if (item.border) {
        card.classList.add('border-slate-300');
        card.classList.remove('border-white');
      } else {
        card.classList.add('border-white');
        card.classList.remove('border-slate-300');
      }

      if (item.textDark) {
        frenchText.className = "text-5xl sm:text-7xl font-black tracking-wide text-slate-900 mb-2 transition-all drop-shadow-sm";
      } else {
        frenchText.className = "text-5xl sm:text-7xl font-black tracking-wide text-white mb-2 transition-all drop-shadow-md";
      }

      frenchText.textContent = item.french;
      englishText.textContent = item.english;
      phoneticText.textContent = item.phonetic;

      if (shouldSpeak) {
        speakWord(item.french);
      }
    }

    function nextItem() {
      currentIndex = (currentIndex + 1) % activeDataset.length;
      updateDisplay(autoPlayAudio);
      triggerConfetti(0.8, 0.5);
    }

    function prevItem() {
      currentIndex = (currentIndex - 1 + activeDataset.length) % activeDataset.length;
      updateDisplay(autoPlayAudio);
      triggerConfetti(0.2, 0.5);
    }

    function randomItem() {
      if (!activeDataset || activeDataset.length <= 1) return;
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * activeDataset.length);
      } while (newIndex === currentIndex);
      
      currentIndex = newIndex;
      updateDisplay(autoPlayAudio);
      triggerConfetti(0.5, 0.6);
    }

    function handleCardClick(e) {
      const item = activeDataset[currentIndex];
      speakWord(item.french);
      
      const rect = e.currentTarget.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      triggerConfetti(x, y);
    }

    function toggleEnglish() {
      showEnglish = !showEnglish;
      const container = document.getElementById('englishContainer');
      const badge = document.getElementById('englishStatusBadge');

      if (showEnglish) {
        container.style.display = 'block';
        badge.textContent = 'ON';
        badge.className = "text-xs bg-blue-200 text-blue-900 font-bold px-2 py-0.5 rounded-full";
      } else {
        container.style.display = 'none';
        badge.textContent = 'OFF';
        badge.className = "text-xs bg-slate-200 text-slate-600 font-bold px-2 py-0.5 rounded-full";
      }
    }

    function toggleAutoAudio() {
      autoPlayAudio = !autoPlayAudio;
      const badge = document.getElementById('audioStatusBadge');
      const icon = document.getElementById('audioMenuIcon');

      if (autoPlayAudio) {
        badge.textContent = 'ON';
        badge.className = "text-xs bg-amber-200 text-amber-900 font-bold px-2 py-0.5 rounded-full";
        icon.className = "fas fa-volume-up text-lg text-amber-600";
      } else {
        badge.textContent = 'OFF';
        badge.className = "text-xs bg-slate-200 text-slate-600 font-bold px-2 py-0.5 rounded-full";
        icon.className = "fas fa-volume-mute text-lg text-slate-500";
      }
    }

    function setSpeechRate(rate) {
      speechRate = rate;
      const slowBtn = document.getElementById('speedSlowBtn');
      const normBtn = document.getElementById('speedNormalBtn');

      if (rate === 0.7) {
        slowBtn.className = "px-2.5 py-1 rounded-lg bg-white text-amber-700 shadow-sm font-bold transition text-xs";
        normBtn.className = "px-2.5 py-1 rounded-lg font-bold transition text-xs text-slate-600";
      } else {
        normBtn.className = "px-2.5 py-1 rounded-lg bg-white text-amber-700 shadow-sm font-bold transition text-xs";
        slowBtn.className = "px-2.5 py-1 rounded-lg font-bold transition text-xs text-slate-600";
      }

      speakWord(activeDataset[currentIndex].french);
    }

    // ==================== SPEECH ENGINE ====================
    function speakWord(text) {
      if (!synth) return;
      try {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.rate = speechRate;
        utterance.pitch = 1.1;

        if (!frenchVoice) {
          initVoices();
        }
        if (frenchVoice) {
          utterance.voice = frenchVoice;
        }

        synth.speak(utterance);
      } catch (err) {
        console.log("Speech synthesis note:", err);
      }
    }

    function triggerConfetti(originX = 0.5, originY = 0.5) {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 25,
          spread: 60,
          origin: { x: originX, y: originY },
          colors: ['#EF4444', '#3B82F6', '#FACC15', '#22C55E', '#EC4899']
        });
      }
    }

    function switchMode(mode) {
      const learnSec = document.getElementById('learnSection');
      const quizSec = document.getElementById('quizSection');
      const tabLearn = document.getElementById('tabLearn');
      const tabQuiz = document.getElementById('tabQuiz');

      if (mode === 'learn') {
        learnSec.classList.remove('hidden');
        quizSec.classList.add('hidden');
        tabLearn.className = "px-5 py-2 rounded-2xl font-bold text-lg transition-all duration-200 bg-white text-amber-700 shadow-md";
        tabQuiz.className = "px-5 py-2 rounded-2xl font-bold text-lg transition-all duration-200 text-amber-900 hover:bg-white/50";
      } else {
        learnSec.classList.add('hidden');
        quizSec.classList.remove('hidden');
        tabQuiz.className = "px-5 py-2 rounded-2xl font-bold text-lg transition-all duration-200 bg-white text-amber-700 shadow-md";
        tabLearn.className = "px-5 py-2 rounded-2xl font-bold text-lg transition-all duration-200 text-amber-900 hover:bg-white/50";
        startNewQuizRound();
      }
    }

    function startNewQuizRound() {
      if (!activeDataset || activeDataset.length === 0) return;

      const targetIndex = Math.floor(Math.random() * activeDataset.length);
      currentQuizTarget = activeDataset[targetIndex];

      document.getElementById('quizQuestionText').textContent = currentQuizTarget.french;
      
      if (autoPlayAudio) {
        speakWord(currentQuizTarget.french);
      }

      let options = [currentQuizTarget];
      while (options.length < 4 && options.length < activeDataset.length) {
        let randomChoice = activeDataset[Math.floor(Math.random() * activeDataset.length)];
        if (!options.some(o => o.french === randomChoice.french)) {
          options.push(randomChoice);
        }
      }

      options.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('quizOptionsGrid');
      grid.innerHTML = '';

      options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = `h-24 sm:h-28 rounded-2xl border-4 border-white shadow-md transition transform active:scale-95 flex items-center justify-center font-bold text-xl text-white ${option.border ? 'border-slate-300' : ''}`;
        btn.style.backgroundColor = option.hex;

        if (currentModule === 'numbers' || currentModule === 'alphabet') {
          btn.innerHTML = `<span class="text-3xl font-black drop-shadow">${option.english}</span>`;
        } else {
          btn.innerHTML = `<span class="text-sm font-black drop-shadow bg-black/20 px-3 py-1 rounded-xl">${option.english}</span>`;
        }

        btn.onclick = () => handleQuizAnswer(option);
        grid.appendChild(btn);
      });

      const feedback = document.getElementById('quizFeedback');
      feedback.style.opacity = '0';
    }

    function handleQuizAnswer(selected) {
      const feedback = document.getElementById('quizFeedback');
      if (selected.french === currentQuizTarget.french) {
        quizScore += 1;
        document.getElementById('quizScoreText').textContent = quizScore;
        
        feedback.textContent = "🎉 BRAVO! C'est super! 🎉";
        feedback.className = "mt-4 min-h-[3rem] flex items-center justify-center font-bold text-lg rounded-2xl p-2 transition-all bg-emerald-100 text-emerald-800 opacity-100";
        
        triggerConfetti(0.5, 0.5);
        speakWord("Bravo!");

        setTimeout(() => {
          startNewQuizRound();
        }, 1400);
      } else {
        feedback.textContent = "❌ Essaye encore! (Try again!)";
        feedback.className = "mt-4 min-h-[3rem] flex items-center justify-center font-bold text-lg rounded-2xl p-2 transition-all bg-rose-100 text-rose-800 opacity-100";
        speakWord("Non");
      }
    }

    function resetQuizScore() {
      quizScore = 0;
      document.getElementById('quizScoreText').textContent = '0';
      startNewQuizRound();
    }
  </script>
</body>
</html>
