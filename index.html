<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Learning for Kids</title>
  
  <!-- PWA Settings for Mobile/Android -->
  <meta name="theme-color" content="#fef3c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="French Kids">
  
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      touch-action: manipulation;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col justify-between text-slate-800 select-none relative overflow-x-hidden">

  <!-- SETTINGS MODAL OVERLAY -->
  <div id="settingsOverlay" onclick="closeSettings()" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 transition-opacity duration-200 opacity-0 pointer-events-none flex items-center justify-center p-4">
    <!-- SETTINGS MODAL CARD -->
    <div id="settingsModal" onclick="event.stopPropagation()" class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 border-4 border-amber-200 transform scale-95 transition-transform duration-200">
      <div class="flex items-center justify-between pb-3 border-b border-amber-100 mb-5">
        <div class="flex items-center space-x-2">
          <i class="fas fa-cog text-2xl text-amber-500"></i>
          <h2 class="text-xl font-black text-slate-800">Settings</h2>
        </div>
        <button onclick="closeSettings()" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-700 font-bold flex items-center justify-center transition">
          ✕
        </button>
      </div>

      <!-- MODULE-SPECIFIC SETTINGS (DYNAMICALLY SHOWN) -->
      <div id="moduleSpecificSettings" class="hidden mb-5 pb-5 border-b border-amber-100">
        <!-- NUMBER RANGE SELECTOR -->
        <div id="numberRangeSettingGroup" class="hidden">
          <p class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
            <span>🔢</span>
            <span>Number Range</span>
          </p>
          <div class="grid grid-cols-3 gap-2 bg-amber-50 p-1.5 rounded-2xl border border-amber-200">
            <button id="range1-10Btn" onclick="setNumberRange('1-10')" class="py-2 px-2 rounded-xl text-sm font-bold bg-amber-500 text-white transition text-center shadow-sm">
              1 – 10
            </button>
            <button id="range11-20Btn" onclick="setNumberRange('11-20')" class="py-2 px-2 rounded-xl text-sm font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center">
              11 – 20
            </button>
            <button id="range1-20Btn" onclick="setNumberRange('1-20')" class="py-2 px-2 rounded-xl text-sm font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center">
              1 – 20
            </button>
          </div>
        </div>

        <!-- READING LEVEL SELECTOR -->
        <div id="readingLevelSettingGroup" class="hidden">
          <p class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
            <span>📖</span>
            <span>Reading Level</span>
          </p>
          <div class="grid grid-cols-3 gap-2 bg-amber-50 p-1.5 rounded-2xl border border-amber-200">
            <button id="readLevel1Btn" onclick="setReadingLevel(1)" class="py-2 px-1.5 rounded-xl text-xs font-bold bg-amber-500 text-white transition text-center shadow-sm leading-tight">
              Level 1<br><span class="text-[10px] opacity-90">Syllabes</span>
            </button>
            <button id="readLevel2Btn" onclick="setReadingLevel(2)" class="py-2 px-1.5 rounded-xl text-xs font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center leading-tight">
              Level 2<br><span class="text-[10px] opacity-90">Mots</span>
            </button>
            <button id="readLevel3Btn" onclick="setReadingLevel(3)" class="py-2 px-1.5 rounded-xl text-xs font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center leading-tight">
              Level 3<br><span class="text-[10px] opacity-90">Phrases</span>
            </button>
          </div>
        </div>
      </div>

      <!-- COMMON SETTINGS (ALWAYS VISIBLE) -->
      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2.5">General Options</p>
      <div class="space-y-3">
        <!-- ENGLISH HELPER TOGGLE -->
        <button id="toggleEnglishBtn" onclick="toggleEnglish()" 
                class="w-full flex items-center justify-between px-4 py-3.5 bg-blue-50 text-blue-900 hover:bg-blue-100 rounded-2xl font-bold text-sm transition">
          <span class="flex items-center space-x-2.5">
            <i class="fas fa-language text-xl text-blue-600"></i>
            <span>English Helper</span>
          </span>
          <span id="englishStatusBadge" class="text-xs bg-blue-200 text-blue-900 font-black px-2.5 py-1 rounded-full">ON</span>
        </button>

        <!-- SPEAK ON NAVIGATE TOGGLE -->
        <button id="toggleAutoAudioBtn" onclick="toggleAutoAudio()" 
                class="w-full flex items-center justify-between px-4 py-3.5 bg-amber-100/80 text-amber-950 hover:bg-amber-200/80 rounded-2xl font-bold text-sm transition">
          <span class="flex items-center space-x-2.5">
            <i id="audioMenuIcon" class="fas fa-volume-up text-xl text-amber-600"></i>
            <span>Speak on Navigate</span>
          </span>
          <span id="audioStatusBadge" class="text-xs bg-amber-300 text-amber-950 font-black px-2.5 py-1 rounded-full">ON</span>
        </button>

        <!-- VOICE SPEED SELECTOR -->
        <div class="p-3.5 bg-slate-100 rounded-2xl flex items-center justify-between text-sm text-slate-700">
          <span class="font-bold flex items-center space-x-2">
            <i class="fas fa-tachometer-alt text-amber-500 text-lg"></i>
            <span>Voice Speed</span>
          </span>
          <div class="flex bg-slate-200 p-1 rounded-xl space-x-1">
            <button id="speedSlowBtn" onclick="setSpeechRate(0.7)" class="px-3 py-1.5 rounded-lg font-bold transition text-xs text-slate-600">🐢 Slow</button>
            <button id="speedNormalBtn" onclick="setSpeechRate(0.85)" class="px-3 py-1.5 rounded-lg bg-white text-amber-700 shadow-sm font-bold transition text-xs">🧒 Normal</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-white/85 backdrop-blur-md border-b-4 border-amber-200 sticky top-0 z-40 p-3 sm:p-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <!-- LEFT: HOME BUTTON -->
      <button id="homeHeaderBtn" onclick="goHome()" title="Home Menu" 
              class="px-3 py-2 sm:px-4 sm:py-2.5 bg-amber-100 hover:bg-amber-200 active:scale-95 text-amber-950 rounded-2xl flex items-center space-x-2 border-2 border-amber-300 transition shadow-sm cursor-pointer shrink-0">
        <span class="text-2xl leading-none">🇫🇷</span>
        <span class="font-black text-sm sm:text-base">Home</span>
      </button>

      <!-- CENTER: TITLE -->
      <div class="text-center flex-1 min-w-0 px-1">
        <h1 id="headerTitle" class="text-lg sm:text-2xl font-black text-amber-600 tracking-wide leading-tight truncate">Apprendre le Français</h1>
        <p id="headerSubtitle" class="text-xs text-amber-800 font-bold truncate">Choose a Learning Module</p>
      </div>

      <!-- RIGHT: SETTINGS BUTTON -->
      <button onclick="openSettings()" title="Settings" 
              class="px-3 py-2 sm:px-4 sm:py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-800 rounded-2xl flex items-center space-x-2 border-2 border-slate-300 transition shadow-sm cursor-pointer shrink-0">
        <i class="fas fa-cog text-xl text-amber-600"></i>
        <span class="font-black text-sm sm:text-base hidden sm:inline">Settings</span>
      </button>
    </div>
  </header>

  <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-4xl mx-auto w-full">

    <!-- HOME TILE DASHBOARD SECTION -->
    <section id="homeSection" class="w-full max-w-3xl mx-auto py-2">
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-5">
        
        <!-- TILE 1: COULEURS -->
        <button onclick="selectModule('colors')" 
                class="bg-gradient-to-br from-rose-500 to-red-500 hover:from-rose-600 hover:to-red-600 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">🎨</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Couleurs</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">Colors</p>
        </button>

        <!-- TILE 2: VOCABULAIRE (A-Z) -->
        <button onclick="selectModule('vocab')" 
                class="bg-gradient-to-br from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">📚</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Vocabulaire</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">Words (A–Z)</p>
        </button>

        <!-- TILE 3: JOURS DE LA SEMAINE -->
        <button onclick="selectModule('days')" 
                class="bg-gradient-to-br from-sky-400 to-blue-600 hover:from-sky-500 hover:to-blue-700 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">📅</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Jours</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">Days of Week</p>
        </button>

        <!-- TILE 4: NOMBRES -->
        <button onclick="selectModule('numbers')" 
                class="bg-gradient-to-br from-emerald-400 to-teal-600 hover:from-emerald-500 hover:to-teal-700 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">🔢</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Nombres</h2>
          <p id="homeNumbersSub" class="text-xs sm:text-sm font-bold text-white/90 mt-1">Numbers (1–10)</p>
        </button>

        <!-- TILE 5: ALPHABET -->
        <button onclick="selectModule('alphabet')" 
                class="bg-gradient-to-br from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">🔤</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Alphabet</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">A to Z</p>
        </button>

        <!-- TILE 6: LES QUATRE SAISONS -->
        <button onclick="selectModule('seasons')" 
                class="bg-gradient-to-br from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex flex-col items-center justify-center text-center transition transform hover:-translate-y-1 active:scale-95 aspect-square">
          <span class="text-5xl sm:text-6xl mb-3 filter drop-shadow">🌸</span>
          <h2 class="text-xl sm:text-2xl font-black tracking-wide leading-tight">Saisons</h2>
          <p class="text-xs sm:text-sm font-bold text-white/90 mt-1">4 Seasons</p>
        </button>

        <!-- TILE 7: LECTURE (READING FOR KIDS) -->
        <button onclick="selectModule('reading')" 
                class="col-span-2 sm:col-span-3 bg-gradient-to-r from-cyan-500 via-teal-500 to-emerald-500 hover:from-cyan-600 hover:via-teal-600 hover:to-emerald-600 text-white rounded-3xl p-5 sm:p-6 border-4 border-white custom-shadow flex items-center justify-center gap-4 sm:gap-6 text-left transition transform hover:-translate-y-1 active:scale-95">
          <span class="text-5xl sm:text-6xl filter drop-shadow shrink-0">📖</span>
          <div>
            <h2 class="text-2xl sm:text-3xl font-black tracking-wide leading-tight">Je Lis (Reading)</h2>
            <p id="homeReadingSub" class="text-xs sm:text-sm font-bold text-white/95 mt-1">Level 1: Syllables • Level 2: Words • Level 3: Sentences</p>
          </div>
        </button>

      </div>
    </section>

    <!-- LEARN MODE SECTION (HIDDEN ON HOME) -->
    <section id="learnSection" class="w-full flex flex-col items-center hidden">
      
      <!-- MAIN DISPLAY CARD -->
      <div id="displayCard" 
           onclick="handleCardClick(event)" 
           class="w-full max-w-md min-h-[22rem] sm:min-h-[28rem] rounded-3xl border-8 border-white custom-shadow transition-all duration-300 transform active:scale-95 cursor-pointer relative flex flex-col items-center justify-center p-6 text-center overflow-hidden group">
        
        <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>

        <!-- Level 1 Equation Pill (e.g., M + A) -->
        <div id="readingEquation" class="hidden items-center justify-center gap-2 mb-3 z-10"></div>

        <!-- Custom SVG Illustration Container -->
        <div id="cardIllustration" class="w-28 h-28 sm:w-36 sm:h-36 mb-2 hidden items-center justify-center filter drop-shadow-md"></div>

        <!-- Emoji Icon Display for Vocab / Words -->
        <div id="cardIcon" class="text-6xl sm:text-7xl mb-2 hidden filter drop-shadow-md">✈️</div>

        <!-- French Primary Text Display -->
        <h2 id="frenchName" class="text-5xl sm:text-7xl font-black tracking-wide drop-shadow-md text-white mb-3 transition-all">
          Rouge
        </h2>

        <!-- Interactive Syllables / Word Chunks Container (Reading Mode) -->
        <div id="readingChunksContainer" class="hidden flex-wrap items-center justify-center gap-2 mb-3 z-10"></div>

        <!-- English Translation & Phonetics -->
        <div id="englishContainer" class="bg-black/30 backdrop-blur-md px-6 py-3 rounded-2xl text-white mt-1 transition-all">
          <p id="englishName" class="text-2xl sm:text-4xl font-bold">Red</p>
          <p id="phoneticText" class="text-sm sm:text-lg font-semibold opacity-85 italic mt-1">/roozh/</p>
        </div>
      </div>

      <!-- MAIN NAVIGATION CONTROLS -->
      <div class="w-full max-w-md mt-6 grid grid-cols-3 gap-3 sm:gap-4">
        
        <!-- PREVIOUS BUTTON -->
        <button onclick="prevItem()" 
                class="bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-black py-4 px-2 rounded-2xl border-b-4 border-sky-700 text-sm sm:text-base flex items-center justify-center space-x-2 shadow-lg transition transform active:translate-y-1">
          <i class="fas fa-chevron-left text-lg"></i>
          <span>Précédent</span>
        </button>

        <!-- RANDOM BUTTON -->
        <button onclick="randomItem()" 
                class="bg-purple-500 hover:bg-purple-600 active:bg-purple-700 text-white font-black py-4 px-2 rounded-2xl border-b-4 border-purple-800 text-xs sm:text-base flex items-center justify-center space-x-2 shadow-lg transition transform active:translate-y-1">
          <i class="fas fa-dice text-lg"></i>
          <span>Aléatoire</span>
        </button>

        <!-- NEXT BUTTON -->
        <button onclick="nextItem()" 
                class="bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-black py-4 px-2 rounded-2xl border-b-4 border-emerald-700 text-sm sm:text-base flex items-center justify-center space-x-2 shadow-lg transition transform active:translate-y-1">
          <span>Suivant</span>
          <i class="fas fa-chevron-right text-lg"></i>
        </button>
      </div>

    </section>

  </main>

  <script>
    // Register Service Worker for offline capability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swContent = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => new Response("Offline")));
          });
        `;
        const blob = new Blob([swContent], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW note:', err));
      });
    }

    // ==================== CUSTOM SVG ILLUSTRATIONS ====================
    const svgArtwork = {

      `,

      `,

          <circle cx="68" cy="36" r="13" fill="#FBCFE8"/>

          <circle cx="68" cy="52" r="9" fill="#FACC15"/>

      summer: `
        <svg viewBox="0 0 140 120" class="w-full h-full">
          <!-- Sun Rays -->
          <g stroke="#FEF08A" stroke-width="5" stroke-linecap="round">

          <path d="M 10 102 Q 30 92 50 102 T 90 102 T 130 102 L 130 115 L 10 115 Z" fill="#38BDF8"/>
        </svg>
      `,
      autumn: `

          <!-- Autumn Leaf 2 (Golden Yellow) -->

    let autoPlayAudio = true;
    let showEnglish = true;
    let speechRate = 0.85;
    let synth = window.speechSynthesis;
    let frenchVoice = null;

    function initVoices() {
      if (!synth) return;
      let voices = synth.getVoices();
      frenchVoice = voices.find(v => v.lang.startsWith('fr') || v.lang.includes('FR')) || null;
    }

    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = initVoices;
    }

    // ==================== CONTEXT-AWARE SETTINGS MODAL ====================
    function openSettings() {
      const overlay = document.getElementById('settingsOverlay');
      const modal = document.getElementById('settingsModal');
      const modSpecific = document.getElementById('moduleSpecificSettings');
      const numGroup = document.getElementById('numberRangeSettingGroup');
      const readGroup = document.getElementById('readingLevelSettingGroup');

      numGroup.classList.add('hidden');
      readGroup.classList.add('hidden');

      if (currentView === 'module' && currentModule === 'numbers') {
        modSpecific.classList.remove('hidden');
        numGroup.classList.remove('hidden');
      } else if (currentView === 'module' && currentModule === 'reading') {
        modSpecific.classList.remove('hidden');
        readGroup.classList.remove('hidden');
      } else {
        modSpecific.classList.add('hidden');
      }

      overlay.classList.remove('opacity-0', 'pointer-events-none');
      overlay.classList.add('opacity-100');
      modal.classList.remove('scale-95');
      modal.classList.add('scale-100');
    }

    function closeSettings() {
      const overlay = document.getElementById('settingsOverlay');
      const modal = document.getElementById('settingsModal');

      overlay.classList.add('opacity-0', 'pointer-events-none');
      overlay.classList.remove('opacity-100');
      modal.classList.add('scale-95');
      modal.classList.remove('scale-100');
    }

    // ==================== HOME & MODULE NAVIGATION ====================
    function goHome() {
      if (synth) synth.cancel();
      currentView = 'home';

      document.getElementById('homeSection').classList.remove('hidden');
      document.getElementById('learnSection').classList.add('hidden');

      document.getElementById('headerTitle').textContent = "Apprendre le Français";
      document.getElementById('headerSubtitle').textContent = "Choose a Learning Module";
    }

    function selectModule(moduleName) {
      currentView = 'module';
      currentModule = moduleName;
      currentIndex = 0;

      document.getElementById('homeSection').classList.add('hidden');
      document.getElementById('learnSection').classList.remove('hidden');

      const title = document.getElementById('headerTitle');
      const sub = document.getElementById('headerSubtitle');

      if (moduleName === 'colors') {
        activeDataset = colorsDataset;
        title.textContent = "Couleurs en Français";
        sub.textContent = "French Colors";
      } else if (moduleName === 'vocab') {
        activeDataset = vocabDataset;
        title.textContent = "Vocabulaire (A–Z)";
        sub.textContent = "French Vocabulary Words";
      } else if (moduleName === 'days') {
        activeDataset = daysDataset;
        title.textContent = "Jours de la Semaine";
        sub.textContent = "Days of the Week";
      } else if (moduleName === 'numbers') {
        updateNumberDataset();
        title.textContent = "Nombres en Français";
        sub.textContent = `French Numbers (${numberRangeMode})`;
      } else if (moduleName === 'alphabet') {
        activeDataset = alphabetDataset;
        title.textContent = "L'Alphabet Français";
        sub.textContent = "French Alphabet";
      } else if (moduleName === 'seasons') {
        activeDataset = seasonsDataset;
        title.textContent = "Les Quatre Saisons";
        sub.textContent = "The 4 Seasons";
      } else if (moduleName === 'reading') {
        updateReadingDataset();
        title.textContent = "Je Lis (Lecture)";
        sub.textContent = getReadingLevelLabel(readingLevel);
      }

      updateDisplay(autoPlayAudio);
    }

    function getReadingLevelLabel(lvl) {
      if (lvl === 1) return "Level 1: Les Syllabes";
      if (lvl === 2) return "Level 2: Mots Faciles";
      return "Level 3: Petites Phrases";
    }

    function setReadingLevel(lvl) {
      readingLevel = lvl;

      const b1 = document.getElementById('readLevel1Btn');
      const b2 = document.getElementById('readLevel2Btn');
      const b3 = document.getElementById('readLevel3Btn');

      const activeClass = "py-2 px-1.5 rounded-xl text-xs font-bold bg-amber-500 text-white transition text-center shadow-sm leading-tight";
      const inactiveClass = "py-2 px-1.5 rounded-xl text-xs font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center leading-tight";

      b1.className = lvl === 1 ? activeClass : inactiveClass;
      b2.className = lvl === 2 ? activeClass : inactiveClass;
      b3.className = lvl === 3 ? activeClass : inactiveClass;

      if (currentView === 'module' && currentModule === 'reading') {
        currentIndex = 0;
        updateReadingDataset();
        document.getElementById('headerSubtitle').textContent = getReadingLevelLabel(readingLevel);
        updateDisplay(autoPlayAudio);
      }
    }

    function updateReadingDataset() {
      if (readingLevel === 1) {
        activeDataset = readingLevel1Dataset;
      } else if (readingLevel === 2) {
        activeDataset = readingLevel2Dataset;
      } else {
        activeDataset = readingLevel3Dataset;
      }
    }

    function setNumberRange(rangeKey) {
      numberRangeMode = rangeKey;
      
      const b1 = document.getElementById('range1-10Btn');
      const b2 = document.getElementById('range11-20Btn');
      const b3 = document.getElementById('range1-20Btn');

      b1.className = rangeKey === '1-10' 
        ? "py-2 px-2 rounded-xl text-sm font-bold bg-amber-500 text-white transition text-center shadow-sm"
        : "py-2 px-2 rounded-xl text-sm font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center";

      b2.className = rangeKey === '11-20' 
        ? "py-2 px-2 rounded-xl text-sm font-bold bg-amber-500 text-white transition text-center shadow-sm"
        : "py-2 px-2 rounded-xl text-sm font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center";

      b3.className = rangeKey === '1-20' 
        ? "py-2 px-2 rounded-xl text-sm font-bold bg-amber-500 text-white transition text-center shadow-sm"
        : "py-2 px-2 rounded-xl text-sm font-bold bg-amber-100 text-slate-700 hover:bg-amber-200 transition text-center";

      document.getElementById('homeNumbersSub').textContent = `Numbers (${rangeKey})`;

      if (currentView === 'module' && currentModule === 'numbers') {
        currentIndex = 0;
        updateNumberDataset();
        document.getElementById('headerSubtitle').textContent = `French Numbers (${numberRangeMode})`;
        updateDisplay(autoPlayAudio);
      }
    }

    function updateNumberDataset() {
      if (numberRangeMode === '1-10') {
        activeDataset = numbersDatasetAll.slice(0, 10);
      } else if (numberRangeMode === '11-20') {
        activeDataset = numbersDatasetAll.slice(10, 20);
      } else {
        activeDataset = numbersDatasetAll.slice(0, 20);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initVoices();
      goHome();
    });

    // ==================== FLASHCARD DISPLAY & NAVIGATION ====================
    function updateDisplay(shouldSpeak = autoPlayAudio) {
      if (!activeDataset || activeDataset.length === 0) return;

      const item = activeDataset[currentIndex];
      const card = document.getElementById('displayCard');
      const readingEquation = document.getElementById('readingEquation');
      const readingChunks = document.getElementById('readingChunksContainer');
      const cardIllustration = document.getElementById('cardIllustration');
      const cardIcon = document.getElementById('cardIcon');
      const frenchText = document.getElementById('frenchName');
      const englishText = document.getElementById('englishName');
      const phoneticText = document.getElementById('phoneticText');

      card.style.backgroundColor = item.hex;

      if (item.border) {
        card.classList.add('border-slate-300');
        card.classList.remove('border-white');
      } else {
        card.classList.add('border-white');
        card.classList.remove('border-slate-300');
      }

      // Reset Reading Equation & Chunks
      readingEquation.innerHTML = '';
      readingEquation.classList.add('hidden');
      readingEquation.classList.remove('flex');
      readingChunks.innerHTML = '';
      readingChunks.classList.add('hidden');
      readingChunks.classList.remove('flex');

      // Level 1 Reading Equation (e.g., M + A)
      if (currentModule === 'reading' && item.parts) {
        readingEquation.classList.remove('hidden');
        readingEquation.classList.add('flex');
        item.parts.forEach((part, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = part;
          btn.className = "px-4 py-1.5 bg-white/95 hover:bg-white text-slate-900 font-black text-2xl sm:text-3xl rounded-2xl shadow-md active:scale-90 transition";
          btn.onclick = (e) => {
            e.stopPropagation();
            speakWord(part.toLowerCase());
          };
          readingEquation.appendChild(btn);

          if (idx < item.parts.length - 1) {
            const plus = document.createElement('span');
            plus.textContent = "+";
            plus.className = "text-white font-black text-2xl drop-shadow";
            readingEquation.appendChild(plus);
          }
        });
      }

      // Render custom SVG illustration or emoji icon
      if (item.svg) {
        cardIllustration.innerHTML = item.svg;
        cardIllustration.classList.remove('hidden');
        cardIllustration.classList.add('flex');
        cardIcon.classList.add('hidden');
      } else if (item.icon) {
        cardIcon.textContent = item.icon;
        cardIcon.classList.remove('hidden');
        cardIllustration.classList.add('hidden');
        cardIllustration.classList.remove('flex');
      } else {
        cardIcon.classList.add('hidden');
        cardIllustration.classList.add('hidden');
        cardIllustration.classList.remove('flex');
      }

      // Adjust font size dynamically for sentences vs words vs letters
      let sizeClasses = "text-5xl sm:text-7xl";
      if (item.french.length > 15) {
        sizeClasses = "text-3xl sm:text-4xl leading-snug";
      } else if (item.french.length > 10) {
        sizeClasses = "text-4xl sm:text-6xl";
      }

      if (item.textDark) {
        frenchText.className = `${sizeClasses} font-black tracking-wide text-slate-900 mb-2 transition-all drop-shadow-sm`;
      } else {
        frenchText.className = `${sizeClasses} font-black tracking-wide text-white mb-2 transition-all drop-shadow-md`;
      }

      frenchText.textContent = item.french;

      // Level 2 Interactive Color-Coded Syllables (e.g., VÉ · LO)
      if (currentModule === 'reading' && item.syllables) {
        readingChunks.classList.remove('hidden');
        readingChunks.classList.add('flex');
        const pillColors = [
          "bg-amber-300 text-slate-900 border-amber-100",
          "bg-white text-slate-900 border-slate-200",
          "bg-sky-200 text-slate-900 border-sky-100"
        ];
        item.syllables.forEach((syl, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = syl;
          btn.className = `px-4 py-1.5 rounded-2xl font-black text-xl sm:text-2xl border-2 shadow-md active:scale-90 transition ${pillColors[idx % pillColors.length]}`;
          btn.onclick = (e) => {
            e.stopPropagation();
            speakWord(syl.toLowerCase());
          };
          readingChunks.appendChild(btn);
        });
      }

      // Level 3 Interactive Word-by-Word Pills (e.g., Le | chat | dort.)
      if (currentModule === 'reading' && item.words) {
        readingChunks.classList.remove('hidden');
        readingChunks.classList.add('flex');
        item.words.forEach((w) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = w;
          btn.className = "px-3 py-1 bg-white/95 hover:bg-amber-200 text-slate-900 font-black text-base sm:text-lg rounded-xl shadow-sm active:scale-90 transition";
          btn.onclick = (e) => {
            e.stopPropagation();
            speakWord(w);
          };
          readingChunks.appendChild(btn);
        });
      }

      englishText.textContent = item.english;
      phoneticText.textContent = item.phonetic;

      if (shouldSpeak) {
        speakWord(item.speakText || item.french);
      }
    }

    function nextItem() {
      currentIndex = (currentIndex + 1) % activeDataset.length;
      updateDisplay(autoPlayAudio);
      triggerConfetti(0.8, 0.5);
    }

    function prevItem() {
      currentIndex = (currentIndex - 1 + activeDataset.length) % activeDataset.length;
      updateDisplay(autoPlayAudio);
      triggerConfetti(0.2, 0.5);
    }

    function randomItem() {
      if (!activeDataset || activeDataset.length <= 1) return;
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * activeDataset.length);
      } while (newIndex === currentIndex);
      
      currentIndex = newIndex;
      updateDisplay(autoPlayAudio);
      triggerConfetti(0.5, 0.6);
    }

    function handleCardClick(e) {
      const item = activeDataset[currentIndex];
      speakWord(item.speakText || item.french);
      
      const rect = e.currentTarget.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      triggerConfetti(x, y);
    }

    function toggleEnglish() {
      showEnglish = !showEnglish;
      const container = document.getElementById('englishContainer');
      const badge = document.getElementById('englishStatusBadge');

      if (showEnglish) {
        container.style.display = 'block';
        badge.textContent = 'ON';
        badge.className = "text-xs bg-blue-200 text-blue-900 font-black px-2.5 py-1 rounded-full";
      } else {
        container.style.display = 'none';
        badge.textContent = 'OFF';
        badge.className = "text-xs bg-slate-200 text-slate-600 font-black px-2.5 py-1 rounded-full";
      }
    }

    function toggleAutoAudio() {
      autoPlayAudio = !autoPlayAudio;
      const badge = document.getElementById('audioStatusBadge');
      const icon = document.getElementById('audioMenuIcon');

      if (autoPlayAudio) {
        badge.textContent = 'ON';
        badge.className = "text-xs bg-amber-300 text-amber-950 font-black px-2.5 py-1 rounded-full";
        icon.className = "fas fa-volume-up text-xl text-amber-600";
      } else {
        badge.textContent = 'OFF';
        badge.className = "text-xs bg-slate-200 text-slate-600 font-black px-2.5 py-1 rounded-full";
        icon.className = "fas fa-volume-mute text-xl text-slate-500";
      }
    }

    function setSpeechRate(rate) {
      speechRate = rate;
      const slowBtn = document.getElementById('speedSlowBtn');
      const normBtn = document.getElementById('speedNormalBtn');

      if (rate === 0.7) {
        slowBtn.className = "px-3 py-1.5 rounded-lg bg-white text-amber-700 shadow-sm font-bold transition text-xs";
        normBtn.className = "px-3 py-1.5 rounded-lg font-bold transition text-xs text-slate-600";
      } else {
        normBtn.className = "px-3 py-1.5 rounded-lg bg-white text-amber-700 shadow-sm font-bold transition text-xs";
        slowBtn.className = "px-3 py-1.5 rounded-lg font-bold transition text-xs text-slate-600";
      }

      if (currentView === 'module' && activeDataset[currentIndex]) {
        const item = activeDataset[currentIndex];
        speakWord(item.speakText || item.french);
      }
    }

    // ==================== SPEECH ENGINE ====================
    function speakWord(text) {
      if (!synth) return;
      try {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.rate = speechRate;
        utterance.pitch = 1.1;

        if (!frenchVoice) {
          initVoices();
        }
        if (frenchVoice) {
          utterance.voice = frenchVoice;
        }

        synth.speak(utterance);
      } catch (err) {
        console.log("Speech synthesis note:", err);
      }
    }

    function triggerConfetti(originX = 0.5, originY = 0.5) {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 25,
          spread: 60,
          origin: { x: originX, y: originY },
          colors: ['#EF4444', '#3B82F6', '#FACC15', '#22C55E', '#EC4899']
        });
      }
    }
  </script>
</body>
